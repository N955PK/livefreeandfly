<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>drive/time — live free and fly</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.v4.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.v4.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.v4.png">
<style>
:root{--bg:#0a0e13;--ink:#e9edf1;--dim:#8B959E;--line:rgba(233,237,241,.14);--accent:#A31F34;--glass:rgba(16,22,29,.6);
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100svh;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:620px;padding:0 20px calc(40px + env(safe-area-inset-bottom))}
header{padding:calc(30px + env(safe-area-inset-top)) 0 18px;display:flex;align-items:center;gap:16px}
h1{font-family:var(--mono);font-weight:600;font-size:20px;letter-spacing:.05em}
h1 .slash{color:var(--accent);font-weight:700}
h1 a{color:var(--ink);text-decoration:none}
.sub{color:var(--dim);font-size:13px;margin:6px 0 26px;line-height:1.5}
#status{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.04em;margin-bottom:16px;min-height:16px}
#status b{color:var(--ink)}
.apt{display:block;border:1px solid var(--line);border-radius:16px;background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:18px;margin-bottom:12px;
  text-decoration:none;color:var(--ink);transition:border-color .2s}
.apt:hover{border-color:rgba(163,31,52,.55)}
.top{display:flex;align-items:baseline;gap:10px}
.id{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.06em}
.nm{color:var(--dim);font-size:13px}
.go{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.big{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:10px;letter-spacing:.02em}
.big small{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
.wait .big{color:var(--dim);font-size:15px;font-weight:400}
button#retry{display:none;margin:8px auto 0;font-family:var(--mono);font-size:11px;color:var(--ink);
  background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px}
footer{margin-top:26px;color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.04em;line-height:1.9;text-align:center}
footer a{color:var(--dim)}

@media(min-width:940px){
  main{max-width:1060px}
  #cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  #cards .apt{margin-bottom:0}
  .big{font-size:30px}
}
</style>
</head>
<body>
<main>
  <header>
    <a href="/" aria-label="live free and fly — home"><img src="/assets/logo-512.v4.png" alt="" style="height:48px;width:auto;display:block"></a>
    <h1>drive<span class="slash">/</span>time</h1>
  </header>
  <div id="status">locating…</div>
  <div id="cards"></div>
  <button id="retry">try again</button>
  <footer>estimates via <a href="https://project-osrm.org/" target="_blank" rel="noopener">OSRM</a> — free-flow, no traffic · Google Maps link uses live traffic<br>not for navigation planning margins</footer>
</main>
<script>
const GKEY='AIzaSyCQDaDSFow1CyayUbY5bbAhTeDEc8wKG-g';
const APTS=[
 {id:'WVI',n:'Watsonville',lat:36.9357,lon:-121.7896,q:'Watsonville Municipal Airport, Watsonville, CA'},
 {id:'SNS',n:'Salinas',lat:36.6628,lon:-121.6064,q:'Salinas Municipal Airport, Salinas, CA'},
 {id:'OAR',n:'Marina',lat:36.6819,lon:-121.7621,q:'Marina Municipal Airport, Marina, CA'},
];
const $=id=>document.getElementById(id);
const R=6371e3;
function hav(a,b,c,d){const p=Math.PI/180,dl=(c-a)*p,dg=(d-b)*p,
  h=Math.sin(dl/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function fmtMin(s){const m=Math.round(s/60);
  return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');}
function gmap(a,me){
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a.q)+'&travelmode=driving'+
    (me?('&origin='+me.lat+','+me.lon):'');}
function render(me,rows){
  $('cards').innerHTML='';
  const list=APTS.map((a,i)=>({...a,
    r:rows?rows[i]:null,
    dline:me?hav(me.lat,me.lon,a.lat,a.lon):null}))
    .sort((x,y)=>((x.r&&x.r.sec)??x.dline??9e9)-((y.r&&y.r.sec)??y.dline??9e9));
  for(const a of list){
    const el=document.createElement('a');
    el.className='apt'+(a.r?'':' wait');
    el.href=gmap(a,me); el.target='_blank'; el.rel='noopener';
    const mi=a.r?(a.r.meters/1609.344).toFixed(0):(a.dline!=null?(a.dline/1609.344).toFixed(0):null);
    el.innerHTML=`<div class="top"><span class="id">${a.id}</span><span class="nm">${a.n}</span>
      <span class="go">GOOGLE MAPS ↗</span></div>
      <div class="big">${a.r?`<span style="color:${a.r.col||'inherit'}">${fmtMin(a.r.sec)}</span><small>${mi} mi${a.r.traffic?' · in current traffic':' by road'}</small>`
        :(mi!=null?mi+' mi direct — routing…':'awaiting location')}</div>`;
    $('cards').appendChild(el);
  }
}
function loadGoogle(){
  return new Promise((res,rej)=>{
    if(window.google&&google.maps&&google.maps.DistanceMatrixService)return res();
    const t=setTimeout(()=>rej('timeout'),8000);
    window.__gmcb=()=>{clearTimeout(t);res();};
    const s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+GKEY+'&callback=__gmcb';
    s.onerror=()=>{clearTimeout(t);rej('load');};
    document.head.appendChild(s);
  });
}
async function routeGoogle(me){
  await loadGoogle();
  const svc=new google.maps.DistanceMatrixService();
  const resp=await new Promise((res,rej)=>svc.getDistanceMatrix({
    origins:[{lat:me.lat,lng:me.lon}],
    destinations:APTS.map(a=>({lat:a.lat,lng:a.lon})),
    travelMode:google.maps.TravelMode.DRIVING,
    drivingOptions:{departureTime:new Date(),trafficModel:google.maps.TrafficModel.BEST_GUESS},
    unitSystem:google.maps.UnitSystem.IMPERIAL
  },(r,st)=>st==='OK'?res(r):rej(st)));
  const row=resp.rows[0]&&resp.rows[0].elements;
  if(!row||row.some(e=>e.status!=='OK'))throw 'row';
  return row.map(e=>{
    const sec=(e.duration_in_traffic||e.duration).value, base=e.duration.value;
    const ratio=base?sec/base:1;
    const col=!e.duration_in_traffic?null:ratio<=1.1?'#39d07f':ratio<=1.35?'#ffa32e':'#ff4d4d';
    return {sec,meters:e.distance.value,traffic:!!e.duration_in_traffic,col};
  });
}
async function routeOSRM(me){
  const coords=[`${me.lon},${me.lat}`,...APTS.map(a=>`${a.lon},${a.lat}`)].join(';');
  const u=`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`;
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
  const r=await fetch(u,{signal:ctl.signal});
  clearTimeout(to);
  const j=await r.json();
  if(j.code!=='Ok'||!j.durations||!j.durations[0])throw 0;
  return j.durations[0].slice(1).map((s,i)=>({sec:s,
    meters:(j.distances&&j.distances[0])?j.distances[0][i+1]:hav(me.lat,me.lon,APTS[i].lat,APTS[i].lon),
    traffic:false}));
}
async function route(me){
  try{
    const rows=await routeGoogle(me);
    render(me,rows);
    $('status').innerHTML='drive times from <b>your location</b> · Google Maps, live traffic';
    document.querySelector('footer').innerHTML='times by Google Maps with current traffic · tap a field for turn-by-turn<br>not for navigation planning margins';
    return;
  }catch(e){}
  try{
    const rows=await routeOSRM(me);
    render(me,rows);
    $('status').innerHTML='drive times from <b>your location</b> · free-flow estimate (traffic engine unavailable)';
  }catch(e){
    $('status').textContent='routing unreachable — straight-line distances shown; Google Maps links still work';
  }
}
function locate(){
  $('retry').style.display='none';
  $('status').textContent='locating…';
  render(null,null);
  if(!navigator.geolocation){
    $('status').textContent='no location available on this device — tap a field for directions';
    return;
  }
  navigator.geolocation.getCurrentPosition(p=>{
    const me={lat:p.coords.latitude,lon:p.coords.longitude};
    render(me,null);
    $('status').textContent='routing…';
    route(me);
  },err=>{
    $('status').textContent=err.code===1
      ?'location permission declined — tap a field for directions in Google Maps'
      :'couldn\u2019t get a location fix — try again';
    $('retry').style.display='block';
  },{enableHighAccuracy:false,timeout:12000,maximumAge:120000});
}
$('retry').onclick=locate;
render(null,null);
locate();
</script>
</body>
</html>
