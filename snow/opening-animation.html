<!--
  Turbo Snow's animated opening screen. NOT USED: the page shows a plain logo screen instead (see #splash in index.html).
  Kept here so it can be brought back. To use it:
    1. In index.html, replace the #splash rules in <style> with the <style> block below.
    2. Replace the <div id="splash"> line with the markup below, and put the first <script> block (the drifting flakes) after it.
    3. Replace reveal() with the second <script> block (the logo spins up, holds at least 1.5 s, then winds down to a stop).
-->
<style>
#splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:linear-gradient(#2a78d6,#0d366b);color:#fff;transition:opacity .5s ease,visibility .5s}
#splash img{width:min(38vw,170px);height:auto;animation:spinup 1.4s cubic-bezier(.55,0,.9,.5) both,spin .55s linear 1.4s infinite}
#splash b{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:650;opacity:0;animation:rise .6s ease .25s forwards}
#splash i{position:absolute;top:-12px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.55;animation:drift linear infinite}
.embed #splash{background:linear-gradient(var(--host-fill,#2a78d6),color-mix(in oklab,var(--host-fill,#2a78d6) 45%,#000))}
#splash.done{opacity:0;visibility:hidden}
@keyframes spinup{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:.92;transform:none}}
@keyframes drift{to{transform:translateY(105vh)}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}#splash i{display:none}}
</style>

<div id="splash" aria-hidden="true"><img src="icons/mark-white.png?v=2" alt="" width="170" height="170"><b>Turbo Snow</b></div>

<script>
// A few flakes on the opening screen, placed before anything else loads.
for (let n = 0; n < 26; n++) {
  const flake = document.createElement("i"), size = 3 + Math.random() * 4;
  flake.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${4 + Math.random() * 5}s;animation-delay:${-Math.random() * 8}s`;
  document.getElementById("splash").appendChild(flake);
}
</script>

<script>
// The opening screen stays up until the page and the map are ready (or 8 seconds pass), and at least long
// enough for the logo to spin up.
const opened = performance.now();
let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  setTimeout(() => {
    const splash = $("splash"), logo = splash.querySelector("img");
    const finish = () => splash.classList.add("done");
    if (!logo.animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) { finish(); return; }
    // The prop winds down: from wherever it is now, a little over one more turn, easing to a stop upright.
    const m = new DOMMatrixReadOnly(getComputedStyle(logo).transform);
    const angle = (Math.atan2(m.b, m.a) * 180 / Math.PI + 360) % 360, target = angle + (360 - angle) + 360;
    for (const running of logo.getAnimations()) running.cancel();
    logo.animate([{transform: `rotate(${angle}deg)`}, {transform: `rotate(${target}deg)`}],
      {duration: 1300, easing: "cubic-bezier(.12,.55,.25,1)", fill: "forwards"}).finished.then(() => setTimeout(finish, 250), finish);
  }, Math.max(0, 1500 - (performance.now() - opened)));
}
</script>
