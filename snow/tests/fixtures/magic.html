,"_updatedDate":"2026-03-01T14:38:53.991Z","open":"","title":"Voodoo 🌲"},{"_id":"0d977496-ef02-4597-9be1-e196982095e4","_owner":"e2e7b6b6-5cfa-45c2-8834-7682ad2b41d2","_createdDate":"2024-10-30T19:27:09.395Z","_updatedDate":"2026-03-08T13:17:27.076Z","title":"White Tiger 🌲"}]},"comp-m8zypegh1":{"html":"<h5 class=\"font_5 wixui-rich-text__text\"><span class=\"wixui-rich-text__text\">0<\/span><\/h5>"},"comp-m8zypmht":{"html":"<h5 class=\"font_5 wixui-rich-text__text\" style=\"line-height:1em;\"><span class=\"wixui-rich-text__text\">0<\/span><\/h5>"},"comp-m8zyptzl":{"html":"<h5 class=\"font_5 wixui-rich-text__text\" style=\"line-height:1em;\"><span class=\"wixui-rich-text__text\">0&quot;<\/span><\/h5>"},"comp-m8zyq0nf1":{"html":"<h5 class=\"font_5 wixui-rich-text__text\" style=\"line-height:1em;\"><span class=\"wixui-rich-text__text\">3&quot;<\/span><\/h5>"},"comp-m8zyqayp":{"html":"<h5 class=\"font_5 wixui-rich-text__text\" style=\"line-height:1em;\"><span class=\"wixui-rich-text__text\">0<\/span><\/h5>"},"comp-m8zyqhjp":{"html":"<h5 class=\"font_5 wixui-rich-text__text\" style=\"line-height:1em;\"><span class=\"wixui-rich-text__text\">0<\/span><\/h5>"},"comp-m2wh6u6y":{"html":"<p class=\"font_8 wixui-rich-text__text\"><span class=\"wixui-rich-text__text\">UNDERSTANDING MAGIC &amp; SNOW REPORTS (scroll down for today&#39;s report): For those new to what makes Magic different and why we earned the #2 ranking in the East for best &quot;Terrain Variety&quot; from SKI Magazine readers:<br>- Magic emphasizes a mix of all-natural snow trails and machine-made snow trails. Why? All-Natural snow generally skis better but machine-made snow and grooming lasts longer with less natural obstacles encountered like bare patches, rocks that come with all-natural trails. Variety!<br>- Magic has lots of glades\/treeskiing and very steep trails that are not for snowcat groomers and do not have snowmaking equipment on them. Those all-natural trails are for experts-only (not for people who ski just groomed black diamonds at other resorts) and many Magic skiers\/riders tend to have secondary equipment (&quot;rock skis&quot;) to tackle these trails and glades if snow coverage is &quot;thin&quot;. They are identified as &quot;Expert-only&quot; and &quot;All-Natural&quot; on the snow report. While trails like these will be opened by patrol when they are &quot;skiable&quot;--use caution always as there are seen and unseen obstacles and conditions are always variable. Variety!<br>- Natural snow trails do get moguls over time. Many here like to ski moguls, so mogul fields will be encountered at times on those all-natural trails. Look for trails that are &quot;all-natural&quot; on the snow report and do not have a check mark under &quot;groomed&quot; if want to ski moguls...or avoid those trails until you see a groomed check mark if you prefer not to ski moguls. We do groom natural snow trails when there is enough snow. Variety!<br>- Trail difficulty markings\/signs are relevant only to this mountain. Our trails are generally more difficult and steeper than many other areas. So our &quot;Green Circles&quot; do not mean they are &quot;beginner&quot; trails, they mean they are the &quot;easiest&quot; trails in terms of steepness on this particular mountain. Beginners should use the surface lifts (conveyor and tow handle) and get comfortable there first before next trying the Green Lift to mid-mtn. If you feel you can&#39;t get down, call ski patrol: put this # in your mobile phone: 802-428-3301 and they will happily give you a ride down to the surface lifts. Our snow sports instructors are fantastic at helping you improve your skiing so you can tackle with confidence more trails off the lifts. <br>- Search the snow report for the type of trails you like to ski (ex: Green circles or Blue squares with snowmaking &amp; machine groomed trails) before exploring other more difficult options.<br>- Conditions change constantly due to weather, and the snow report will always be updated throughout the ski day. The first report comes out at 6:30am when received from the grooming staff before anyone has skied the mountain. Then the report is updated by 9am once Ski Patrol reports in on all trails--and often throughout the day with openings and closings if they occur. We will also report at the end of the day what we expect for the next day. <br><br>Thank you for choosing Magic. It&#39;s different. Like skiing used to be!<br>____________________________________________________________________________________________________________________________________________________________________________________________________________________<br><br>November 24 Report: <br>Temps finally dropped enough at 5:30am to start guns at the summit--also 3 fan guns going at base under very marginal temps there. Temps look to be in lower 30s by Noon, so will shut those down until sun goes down and then continue through tonight on both summit and base. Just need temps to stay in the mid-20s or lower here but it looks like Thursday morning will bring snowmaking to an end for Thanksgiving. Definitely still in a warmer than normal cycle into early December. Currently opening day is scheduled for 12\/12. We will fight to do what we can, whenever we can!<br><br>Recent news from Ski Magazine has Magic rated the #5 ski resort in the East based on their skier survey! Definitely a David vs Goliath story! We also ranked #2 in &quot;Terrain Variety&quot; and &quot;Challenge&quot; in the East. That&#39;s right on target. Magic packs a punch!<br><br>Our Black Friday sales are happening now and end on Cyber Monday at midnight 11\/30. Freedom 4-Packs are 100% transferable ticket voucher codes at just $80\/per ticket. Throwback Cards prices go up Dec 1 as do our Season Passes and day ticket prices. Don&#39;t miss out! <br><br>Also, sign your children up for our Seasonal youth programs (Devo, Race and Freeride). Great coaching, skill development and just a great way to _updatedDate":{"$date":"2026-03-01T14:38:53.991Z"},"open":"","title":"Voodoo 🌲"},"0d977496-ef02-4597-9be1-e196982095e4":{"_id":"0d977496-ef02-4597-9be1-e196982095e4","_owner":"e2e7b6b6-5cfa-45c2-8834-7682ad2b41d2","_createdDate":{"$date":"2024-10-30T19:27:09.395Z"},"_updatedDate":{"$date":"2026-03-08T13:17:27.076Z"},"title":"White Tiger 🌲"}},"SnowReport":{"5ded96a1-11a3-4741-8c44-241d735ecf2b":{"48HrTotal":"0","snowReport":"UNDERSTANDING MAGIC & SNOW REPORTS (scroll down for today's report): For those new to what makes Magic different and why we earned the #2 ranking in the East for best \"Terrain Variety\" from SKI Magazine readers:\n- Magic emphasizes a mix of all-natural snow trails and machine-made snow trails. Why? All-Natural snow generally skis better but machine-made snow and grooming lasts longer with less natural obstacles encountered like bare patches, rocks that come with all-natural trails. Variety!\n- Magic has lots of glades\/treeskiing and very steep trails that are not for snowcat groomers and do not have snowmaking equipment on them. Those all-natural trails are for experts-only (not for people who ski just groomed black diamonds at other resorts) and many Magic skiers\/riders tend to have secondary equipment (\"rock skis\") to tackle these trails and glades if snow coverage is \"thin\". They are identified as \"Expert-only\" and \"All-Natural\" on the snow report. While trails like these will be opened by patrol when they are \"skiable\"--use caution always as there are seen and unseen obstacles and conditions are always variable. Variety!\n- Natural snow trails do get moguls over time. Many here like to ski moguls, so mogul fields will be encountered at times on those all-natural trails. Look for trails that are \"all-natural\" on the snow report and do not have a check mark under \"groomed\" if want to ski moguls...or avoid those trails until you see a groomed check mark if you prefer not to ski moguls. We do groom natural snow trails when there is enough snow. Variety!\n- Trail difficulty markings\/signs are relevant only to this mountain. Our trails are generally more difficult and steeper than many other areas. So our \"Green Circles\" do not mean they are \"beginner\" trails, they mean they are the \"easiest\" trails in terms of steepness on this particular mountain. Beginners should use the surface lifts (conveyor and tow handle) and get comfortable there first before next trying the Green Lift to mid-mtn. If you feel you can't get down, call ski patrol: put this # in your mobile phone: 802-428-3301 and they will happily give you a ride down to the surface lifts. Our snow sports instructors are fantastic at helping you improve your skiing so you can tackle with confidence more trails off the lifts. \n- Search the snow report for the type of trails you like to ski (ex: Green circles or Blue squares with snowmaking & machine groomed trails) before exploring other more difficult options.\n- Conditions change constantly due to weather, and the snow report will always be updated throughout the ski day. The first report comes out at 6:30am when received from the grooming staff before anyone has skied the mountain. Then the report is updated by 9am once Ski Patrol reports in on all trails--and often throughout the day with openings and closings if they occur. We will also report at the end of the day what we expect for the next day. \n\nThank you for choosing Magic. It's different. Like skiing used to be!\n____________________________________________________________________________________________________________________________________________________________________________________________________________________\n\nNovember 24 Report: \nTemps finally dropped enough at 5:30am to start guns at the summit--also 3 fan guns going at base under very marginal temps there. Temps look to be in lower 30s by Noon, so will shut those down until sun goes down and then continue through tonight on both summit and base. Just need temps to stay in the mid-20s or lower here but it looks like Thursday morning will bring snowmaking to an end for Thanksgiving. Definitely still in a warmer than normal cycle into early December. Currently opening day is scheduled for 12\/12. We will fight to do what we can, whenever we can!\n\nRecent news from Ski Magazine has Magic rated the #5 ski resort in the East based on their skier survey! Definitely a David vs Goliath story! We also ranked #2 in \"Terrain Variety\" and \"Challenge\" in the East. That's right on target. Magic packs a punch!\n\nOur Black Friday sales are happening now and end on Cyber Monday at midnight 11\/30. Freedom 4-Packs are 100% transferable ticket voucher codes at just $80\/per ticket. Throwback Cards prices go up Dec 1 as do our Season Passes and day ticket prices. Don't miss out! \n\nAlso, sign your children up for our Seasonal youth programs (Devo, Race and Freeride). Great coaching, skill development and just a great way to make life-long friends! Every weekend starting Christmas week!","lifts":"0","_id":"5ded96a1-11a3-4741-8c44-241d735ecf2b","_owner":"2a973652-396e-4d48-84f0-db1dfbd0a09b","_createdDate":{"$date":"2026-01-31T15:19:05.966Z"},"trails":"0","_updatedDate":{"$date":"2026-11-24T16:43:01.498Z"},"week":"0\"","24HrTotal":"0","seasonTotal":"3\""}},"Webcam":{"SINGLE_ITEM_ID":{"_id":"SINGLE_ITEM_ID","_owner":"e2e7b6b6-5cfa-45c2-8834-7682ad2b41d2","_createdDate":{"$date":"2025-04-02T13:54:39.873Z"},"_updatedDate":{"$date":"2026-11-24T15:55:20.791Z"},"webcamUrl":"https:\/\/www.youtube.com\/live\/y3U8IK22ZH8?si=WJ5ijxtrwXDg8hxh"}}},"uniqueFieldValuesByCollection":{"Import453":{},"Import939":{},"Import631":{},"Import543":{},"Import861":{},"SnowReport":{},"Webcam":{}}}},"225dd912-7dea-4738-8688-4b8c6955ffc2":{"form-viewer-comp-m12qehfg":{"formsById":{"316308eb-4893-4177-b537-35d991a802df":{"id":"316308eb-4893-4177-b537-35d991a802df","fields":[{"id":"fa3b0aad-f2fe-47df-ee69-6441506710df","target":"email_443e","validation"
