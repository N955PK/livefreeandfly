ll all operate today from 9am-4pm. It will be mostly sunny with temps up into the low 20s. \n\nConditions are still excellent despite not much fresh snow since the big dump 10 days ago. Snowmaking trails have been groomed daily and are skiing beautifully, while the natural trails are a mixed variety of great packed powder with some skied off sections and obstacles, especially in some steep glades. Ski with caution, with West Side for experts only.\n\nFriday also looks to also be in the low 20s while Saturday is in the upper teens to start with temps falling during the day. Friday night in Saturday there may be a clipper that brings some light snow for Saturday, perhaps 1-2\".  Friday and Saturday from 4-7p we will also have the lights on in the Abracadabra area with general skiing on one side and park features on the other after a park build this week. Tickets for Abracadabra nights available online, or can be a $20 upgrade at the ticket office for to your day ticket.\n\nBlack Line Tavern: Thursday night is trivia night in the BLT. The game begins at 6:30 sharp and usually runs about 90 minutes. Hope to see you there! \n\nUPHILL Information: Open 9am-3:30pm on designated uphill route. ","lifts":"4","_id":"5ded96a1-11a3-4741-8c44-241d735ecf2b","_owner":"2a973652-396e-4d48-84f0-db1dfbd0a09b","_createdDate":{"$date":"2026-01-31T15:19:05.966Z"},"trails":"48","_updatedDate":{"$date":"2026-02-05T15:24:37.824Z"},"week":"0\"","24HrTotal":"0\"","seasonTotal":"73\""}},"Webcam":{"SINGLE_ITEM_ID":{"_id":"SINGLE_ITEM_ID","_owner":"e2e7b6b6-5cfa-45c2-8834-7682ad2b41d2","_createdDate":{"$date":"2025-04-02T13:54:39.873Z"},"_updatedDate":{"$date":"2026-02-04T15:13:38.222Z"},"webcamUrl":"https:\/\/www.youtube.com\/live\/pyWUbG3SEBk?si=39JQIRXJwskaru8A"}}},"uniqueFieldValuesByCollection":{"Import453":{},"Import939":{},"Import631":{},"Import543":{},"Import861":{},"SnowReport":{},"Webcam":{}}}},"675bbcef-18d8-41f5-800e-131ec9e08762":{"importedNamespaces":[]},"225dd912-7dea-4738-8688-4b8
