<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>game/room</title>
<meta property="og:title" content="game/room">
<meta property="og:description" content="Games for two, played over a link.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://livefreeandfly.org/assets/og-card.v8.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.v13.png">
<link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.v13.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.v13.png">
<link rel="stylesheet" href="room.css">
<style>
.page{max-width:880px}
.me{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.me .t{flex:1;min-width:0}
.me .t b{display:block;font-size:17px}
.me .t span{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.cols{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.tile{display:block;position:relative;border:1px solid var(--line);border-radius:16px;background:var(--glass);
  padding:22px 20px;text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s}
a.tile:hover{border-color:rgba(163,31,52,.55);transform:translateY(-2px)}
.tile h2{font-family:var(--mono);font-size:15px;letter-spacing:.05em;font-weight:600}
.tile p{color:var(--dim);font-size:13px;line-height:1.55;margin-top:8px}
.tile .suits{position:absolute;top:18px;right:18px;font-size:15px;letter-spacing:2px;color:var(--dim)}
.tile .suits b{color:var(--hot);font-weight:400}
.tile.soon{opacity:.55}
.tile.soon h2{color:var(--dim)}
.soonchip{position:absolute;top:20px;right:18px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.foot{margin-top:26px;text-align:center}
.foot button{color:var(--dim);font-size:13px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main class="page">
  <a class="crumb" href="/">← live free / fly</a>
  <h1>game<span class="slash">/</span>room</h1>
  <p class="tag">Games for two. Open a table, send the link, play.</p>

  <div class="panel"><button class="me" id="me" aria-label="Change your name and avatar"></button></div>

  <div class="cols">
    <div class="panel"><h2>Your tables</h2><div id="mine"><p class="none">Loading…</p></div></div>
    <div class="panel"><h2>Open tables</h2><div id="open"><p class="none">Loading…</p></div></div>
  </div>

  <p class="label" style="margin:26px 0 0">The games</p>
  <div class="grid">
    <a class="tile" href="/games/gin/">
      <span class="suits">♠︎<b>♥︎♦︎</b>♣︎</span>
      <h2>gin<span class="slash">/</span>rummy</h2>
      <p>Ten cards, a knock card, and a friend. Single game or Hollywood.</p>
    </a>
    <div class="tile soon">
      <span class="soonchip">SOON</span>
      <h2>next<span class="slash">/</span>deal</h2>
      <p>Another game will be dealt in here.</p>
    </div>
  </div>
  <p class="foot"><button id="device">Play on another device</button></p>
</main>

<script src="room.js"></script>
<script>
(() => {
'use strict';
const { $, h, profile, avatarEl } = Room;

function paintMe() {
  const has = !!profile.name.trim();
  $('#me').replaceChildren(avatarEl(profile, 'big'), h('div', { class: 't' },
    h('b', {}, has ? profile.name : 'Pick a name and a face'), h('span', {}, has ? 'This is how you show up at every table.' : 'It takes ten seconds.')),
    h('span', { class: 'chev' }, '›'));
}
async function refresh() {
  if (document.hidden) return;
  try {
    const [mine, open] = await Promise.all([Room.mine(), Room.lobby()]);
    Room.showTables($('#mine'), mine, 'mine', 'You’re not at a table yet. Pick a game below to open one.');
    Room.showTables($('#open'), open, 'open', 'Nobody is waiting for a game right now.');
    const turns = mine.filter((t) => t.your_turn).length;
    document.title = (turns ? `(${turns}) ` : '') + 'game/room';
  } catch (e) {
    for (const id of ['#mine', '#open']) if ($(id).textContent === 'Loading…') $(id).replaceChildren(h('p', { class: 'none' }, e.message));
  }
}
$('#me').onclick = () => Room.profileDialog(() => { paintMe(); refresh(); });
$('#device').onclick = () => { if (Room.named()) Room.deviceDialog(); else Room.profileDialog(paintMe); };
paintMe();
Room.ready.then(() => { paintMe(); refresh(); setInterval(refresh, 5000); });
document.addEventListener('visibilitychange', refresh);
})();
</script>
</body>
</html>
