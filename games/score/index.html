<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<title>Score pad · Ace</title>
<meta property="og:title" content="Score pad · Ace">
<meta property="og:description" content="A gin rummy score sheet for a game with real cards.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://livefreeandfly.org/games/icons/og.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/games/icons/favicon-32.png?v=3">
<link rel="icon" type="image/svg+xml" sizes="any" href="/games/icons/favicon.svg?v=3">
<link rel="apple-touch-icon" href="/games/icons/icon-180.png?v=3">
<link rel="manifest" href="/games/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ace">
<link rel="stylesheet" href="../room.css?v=7">
<style>
/* The score pad: a gin rummy sheet for a game played with real cards. Nothing here talks to the card room; the
   sheet lives on this device. The games of a Hollywood match sit side by side as on a paper sheet, each with a
   column for every player, and each hand is a row. */
.page{max-width:720px}
.names{display:flex;gap:8px;flex-wrap:wrap}
.names input{flex:1;min-width:90px;height:40px;border-radius:999px;background:var(--field);border:1px solid var(--border);color:var(--ink);font:inherit;font-size:15px;padding:0 14px;-webkit-appearance:none;appearance:none}
.names input:focus{outline:none;border-color:var(--accent)}
.label{margin:16px 0 8px}
.label:first-child{margin-top:0}
/* Adding a hand: who won it, how many, add. */
.who{display:flex;gap:8px}
.who button{flex:1;min-width:0;min-height:48px;padding:0 10px;border-radius:999px;background:var(--wash);font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform .32s cubic-bezier(.3,1.6,.5,1),background-color .15s}
.who button:active{transform:scale(.95);transition-duration:.1s}
.who button[aria-pressed=true]{background:var(--ink);color:var(--page)}
/* The adding machine: opens when a player is tapped, so the phone's own keyboard never comes up. A strip of tape
   shows what has been keyed, the total sits under it, and the keys are laid out like a calculator's. */
dialog.keys{max-width:380px;padding:16px}
.keys .tape{min-height:62px;padding:10px 14px 12px;border-radius:18px;background:var(--field);border:1px solid var(--border);text-align:right;overflow:hidden}
.keys .tape .sum{display:block;min-height:19px;font-size:14.5px;font-weight:600;color:var(--muted);white-space:nowrap;direction:rtl;text-overflow:ellipsis;overflow:hidden}
.keys .tape .sum bdi{direction:ltr;unicode-bidi:isolate}
.keys .tape .tot{display:block;font-size:46px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.keys .tape .tot.zero{color:var(--muted)}
.keys .tape .tot.neg{color:var(--warn)}
.keys .tape .tot.bump{animation:bump .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{from{transform:scale(1.08)}}
.keys .who{margin:10px 0}
.keys .who button{min-height:42px;font-size:15.5px}
.keys .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys .grid button{height:56px;border-radius:999px;background:var(--wash);font-size:23px;font-weight:600;
  transition:transform .32s cubic-bezier(.3,1.6,.5,1),background-color .15s,color .15s}
.keys .grid button:active{transform:scale(.93);transition-duration:.08s}
.keys .grid button.op{background:var(--tint);color:var(--accent);font-size:26px;font-weight:700}
.keys .grid button.op[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.keys .grid button.fn{font-size:17px;font-weight:700;color:var(--ink2)}
/* Gin is a switch, not a key: on or off, so its 25 can only ever be in the total once. */
.keys .grid button.gin{grid-column:span 2;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wash);color:var(--ink)}
.keys .grid button.gin i{font-style:normal;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--border)}
.keys .grid button.gin[aria-pressed=true]{background:var(--gold);color:var(--on-gold)}
.keys .grid button.gin[aria-pressed=true] i{background:rgba(0,0,0,.14)}
.keys .btns{margin-top:12px}
.hint{color:var(--muted);font-size:13.5px;margin-top:12px}
/* What is being played, in one line; tapping it changes it. */
.setup{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);padding:0 8px 0 16px;border-radius:999px;background:var(--wash);text-align:left;font-size:14.5px;color:var(--ink2);
  transition:transform .32s cubic-bezier(.3,1.6,.5,1)}
.setup:active{transform:scale(.98);transition-duration:.1s}
.setup span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.setup b{flex:none;display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);color:var(--accent);font-size:13.5px;font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* The winner's buttons. */
.who.big button{display:flex;align-items:center;justify-content:center;min-height:60px;padding:6px 8px}
.who.big button b{display:block;max-width:100%;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;gap:8px;margin-top:18px}
.foot .ghost{flex:1;min-width:0;white-space:nowrap}
/* The match is over. */
.over{text-align:center;padding:24px 18px;margin-top:14px}
.setup + .panel{margin-top:14px}
.over .cup{font-size:44px;line-height:1}
.over h2{font-size:24px;font-weight:750;color:var(--ink);letter-spacing:-.02em;margin:6px 0 2px}
.over p{color:var(--muted);font-size:15px}
.over .pay{font-size:18px;font-weight:750;color:var(--hi);margin-top:8px}
.over .go{margin-top:16px}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px}
#toast button{flex:none;height:32px;padding:0 14px;border-radius:999px;background:var(--page);color:var(--ink);font-size:14px;font-weight:700}
.confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:170;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
details.work{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
details.work summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:650;color:var(--muted)}
details.work summary::-webkit-details-marker{display:none}
details.work summary::after{content:"›";font-size:20px;line-height:1;transition:transform .2s}
details.work[open] summary::after{transform:rotate(90deg)}
details.work .gt:first-of-type{margin-top:10px}
table.pad tbody td small i{font-style:normal;color:var(--hi);font-weight:650}
/* The sheet. */
.scroll{overflow-x:auto;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch}
table.pad{border-collapse:collapse;width:100%;font-size:15px}
table.pad th,table.pad td{padding:7px 4px;text-align:center;min-width:38px}
table.pad thead th{font-size:13px;font-weight:650;color:var(--muted)}
table.pad thead tr.g th{font-size:14px;color:var(--ink);padding-bottom:2px}
table.pad thead tr.g th.done{color:var(--hi)}
table.pad thead tr.n th{border-bottom:1px solid var(--border);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.pad .first{border-left:1px solid var(--border)}
table.pad td.h,table.pad th.h{width:30px;min-width:30px;color:var(--muted);font-size:13px;text-align:left;padding-left:0}
table.pad tbody tr{border-bottom:1px solid var(--border)}
table.pad tbody td.has{cursor:pointer}
table.pad tbody td b{font-weight:700}
table.pad tbody td small{display:block;font-size:11.5px;color:var(--muted);line-height:1.1}
table.pad tbody td.neg small{color:var(--warn)}
table.pad tbody td.new b{color:var(--accent)}
table.pad tfoot td{font-weight:750;font-size:16px;padding-top:9px}
table.pad tfoot tr.bx td{font-weight:500;font-size:13px;color:var(--muted);padding-top:0;white-space:nowrap}
table.pad tfoot tr.bx td.h{font-size:10px}
/* Three players at Hollywood is nine columns: drawn tighter, so the whole sheet fits a phone without sliding. */
table.pad.tight{font-size:13.5px}
table.pad.tight th,table.pad.tight td{padding:6px 1px;min-width:31px}
table.pad.tight thead tr.n th{font-size:11.5px;max-width:34px}
table.pad.tight tfoot td{font-size:14px}
table.pad.tight tfoot tr.bx td{font-size:12px}
table.pad.tight tbody td small{font-size:10.5px}
table.pad tfoot td.win{color:var(--hi)}
/* What it comes to. */
.reck .ln{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0}
.reck .ln span:last-child{white-space:nowrap;font-weight:600}
.reck .gt{font-size:13px;font-weight:650;color:var(--muted);margin-top:12px}
.reck .gt:first-child{margin-top:0}
.reck .pay{font-size:18px;font-weight:750;color:var(--hi)}
.reck .pay + .pay{margin-top:4px}
.reck small{display:block;color:var(--muted);font-size:13.5px;margin-top:6px}
.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.scoregrid label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.scoregrid .num{width:100%}
</style>
</head>
<body>
<div id="topTint" aria-hidden="true"></div>
<main class="page">
  <a class="crumb" href="/games/">Ace</a>
  <h1>Score pad</h1>
  <p class="tag">Keep score for gin rummy played with real cards.</p>

  <button class="setup" id="setupBtn" aria-label="Change the players, the game and the money"><span id="sumLine"></span><b>Change</b></button>

  <div class="panel over" id="overPanel" hidden></div>

  <div class="panel" id="addPanel">
    <h2>Who won the hand?</h2>
    <div class="who big" id="who"></div>
    <p class="hint">Tap the winner, then add up their points.</p>
  </div>

  <div class="panel">
    <h2 id="sheetTitle">The sheet</h2>
    <div class="scroll"><table class="pad" id="pad"></table></div>
    <p class="none" id="empty">Nothing on the sheet yet.</p>
    <p class="hint" id="sheetHint">Tap any line to take that hand off.</p>
  </div>

  <div class="panel reck" id="reckPanel" hidden><h2>What it comes to</h2><div id="reck"></div></div>

  <div class="foot"><button class="ghost" id="undo">Undo the last hand</button><button class="ghost" id="fresh">New sheet</button></div>
</main>

<script>
(() => {
'use strict';
const $ = (q) => document.querySelector(q);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v; else if (k === 'on') for (const [e, f] of Object.entries(v)) el.addEventListener(e, f);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const KEY = 'ace-score-pad';
const DEFAULT_NAMES = ['We', 'Them', 'Other'];
const fresh = () => ({ players: 2, names: DEFAULT_NAMES.slice(), mode: 'hollywood', target: 150, cents: 1, game: 100, box: 25, shutout: 'bonus', entries: [] });
function load() {
  try {
    const s = { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') };
    s.players = s.players === 3 ? 3 : 2; s.mode = s.mode === 'single' ? 'single' : 'hollywood';
    s.names = DEFAULT_NAMES.map((d, i) => String((s.names || [])[i] || d).slice(0, 14));
    s.entries = (Array.isArray(s.entries) ? s.entries : []).filter((e) => e && Number.isInteger(e.p) && e.p >= 0 && e.p < 3 && Number.isInteger(e.pts) && e.pts !== 0);
    return s;
  } catch (e) { return fresh(); }
}
let S = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* a private window: the sheet lasts until the tab closes */ } };
const name = (p) => S.names[p] || DEFAULT_NAMES[p];
const cash = (cents) => '$' + (Math.abs(cents) / 100).toFixed(2);

// Works the whole sheet out from the hands, in order. A player's first winning hand counts in game one, their
// second in games one and two, and every one after in all three; a finished game takes no more points, and a player
// who has not scored yet starts in the first game still open. Points taken away come off the games the player is
// scoring in, and are not a hand won. A game is over when someone reaches the target.
function work(s) {
  const n = s.mode === 'hollywood' ? 3 : 1, P = s.players;
  const totals = Array.from({ length: n }, () => Array(P).fill(0)), boxes = Array.from({ length: n }, () => Array(P).fill(0));
  const winners = Array(n).fill(-1), entered = Array(P).fill(0), rows = [];
  s.entries.forEach((e, at) => {
    if (e.p >= P) return;
    const row = { at, p: e.p, pts: e.pts, gin: !!e.gin, cells: {} };
    if (winners.every((w) => w !== -1)) { rows.push({ ...row, late: true }); return; }
    if (e.pts > 0) {
      let into = entered[e.p];
      for (let g = into; g < n; g++) if (winners[g] === -1) { into = g + 1; break; }
      entered[e.p] = into;
      for (let g = 0; g < into; g++) if (winners[g] === -1) {
        totals[g][e.p] += e.pts; boxes[g][e.p]++; row.cells[g] = totals[g][e.p];
        if (totals[g][e.p] >= s.target) winners[g] = e.p;
      }
    } else {
      for (let g = 0; g < Math.max(entered[e.p], 1); g++) if (winners[g] === -1) { totals[g][e.p] += e.pts; row.cells[g] = totals[g][e.p]; }
    }
    rows.push(row);
  });
  // Settling a finished game, by the usual convention: the winner takes the difference in points, the game bonus
  // (doubled when the other never scored), and a box for each hand more they won; each other player pays theirs.
  const games = winners.map((w, g) => {
    if (w === -1) return null;
    const owes = [];
    for (let l = 0; l < P; l++) if (l !== w) {
      const shut = totals[g][l] <= 0, pointsBy = totals[g][w] - totals[g][l], bonus = s.game * (shut && s.shutout === 'bonus' ? 2 : 1), boxBy = boxes[g][w] - boxes[g][l];
      let net = pointsBy + bonus + s.box * boxBy;
      if (shut && s.shutout === 'total') net *= 2;
      owes.push({ l, pointsBy, bonus, boxBy, shut, net });
    }
    return { w, owes };
  });
  const balance = Array(P).fill(0);
  games.forEach((g) => g && g.owes.forEach((o) => { balance[g.w] += o.net; balance[o.l] -= o.net; }));
  return { n, P, totals, boxes, winners, rows, games, balance, over: winners.every((w) => w !== -1) };
}

/* ---------- adding a hand ---------- */
// Who is paid what, over the games finished so far. With three players each pair is squared up on its own.
function pays(w) {
  const out = [];
  for (let a = 0; a < w.P; a++) for (let b = a + 1; b < w.P; b++) {
    let net = 0;
    w.games.forEach((g) => g && g.owes.forEach((o) => { if (g.w === a && o.l === b) net += o.net; if (g.w === b && o.l === a) net -= o.net; }));
    if (!net) continue;
    const [up, down] = net > 0 ? [a, b] : [b, a], pts = Math.abs(net);
    out.push(S.cents > 0 ? `Owed to ${name(up)} by ${name(down)}: ${cash(pts * S.cents)}` : `${name(up)} by ${pts} points over ${name(down)}`);
  }
  return out;
}
const rate = () => (S.cents < 100 ? S.cents + '¢' : cash(S.cents)) + ' a point';
function paintAdd(w) {
  $('#sumLine').textContent = `${S.players} players · ${S.mode === 'hollywood' ? 'Hollywood' : 'Single'} to ${S.target}${S.cents > 0 ? ' · ' + (S.cents < 100 ? S.cents + '¢' : cash(S.cents)) : ''}`;
  $('#who').replaceChildren(...Array.from({ length: S.players }, (_, p) => h('button', { on: { click: () => machine(p) } }, h('b', {}, name(p)))));
  $('#addPanel').hidden = w.over;
  $('#undo').disabled = !S.entries.length;
  $('#fresh').disabled = !S.entries.length;
  // The match is over: who won, what is owed, and one button for the next one.
  const over = $('#overPanel'); over.hidden = !w.over;
  if (w.over) {
    const won = Array.from({ length: w.P }, (_, p) => w.winners.filter((x) => x === p).length), top = Math.max(...won), champs = won.filter((x) => x === top).length;
    over.replaceChildren(...[h('div', { class: 'cup' }, '🏆'),
      h('h2', {}, champs === 1 ? `${name(won.indexOf(top))} took the match` : 'The match is over'),
      w.n > 1 ? h('p', {}, Array.from({ length: w.P }, (_, p) => `${name(p)} ${won[p]}`).join(' · ') + ' games') : null,
      ...pays(w).map((line) => h('div', { class: 'pay' }, line)),
      h('button', { class: 'go', on: { click: newSheet } }, 'Start a new sheet')].filter(Boolean));
  }
}
// The adding machine. Key a figure, then + or − and another, as many as it takes: 34 + 12 − 5. The Gin switch puts
// 25 on top, once. What it comes to is what goes on the sheet; if it comes to less than nothing, that much is taken
// off the player instead (a correction, not a hand won). A keyboard works too, for anyone at a desk.
function machine(p) {
  let terms = [], sign = 1, cur = '', gin = false;
  const sum = h('span', { class: 'sum' }), tot = h('span', { class: 'tot', role: 'status', 'aria-live': 'polite' }), go = h('button', { class: 'go' });
  const who = h('div', { class: 'who' }), plus = h('button', { class: 'op', 'aria-label': 'Add the next figure' }, '+'), minus = h('button', { class: 'op', 'aria-label': 'Take the next figure away' }, '−');
  const ginKey = h('button', { class: 'gin', 'aria-label': 'Gin or an undercut: 25 more' }, 'Gin', h('i', {}, '+25'));
  const total = () => terms.reduce((a, b) => a + b, 0) + (cur ? sign * +cur : 0) + (gin ? 25 : 0);
  const draw = (bump) => {
    const t = total(), parts = terms.map((x, i) => (i ? (x < 0 ? '− ' : '+ ') : x < 0 ? '−' : '') + Math.abs(x));
    if (cur || terms.length) parts.push((terms.length ? (sign < 0 ? '− ' : '+ ') : sign < 0 ? '−' : '') + cur);
    if (gin) parts.push((parts.length ? '+ ' : '') + '25 gin');
    sum.replaceChildren(h('bdi', {}, parts.join(' ').trim() || 'Key in the points'));
    tot.textContent = (t < 0 ? '−' : '') + Math.abs(t);
    tot.className = 'tot' + (t === 0 ? ' zero' : t < 0 ? ' neg' : '');
    if (bump) { void tot.offsetWidth; tot.classList.add('bump'); }
    plus.setAttribute('aria-pressed', String(!cur && terms.length > 0 && sign > 0)); minus.setAttribute('aria-pressed', String(!cur && sign < 0));
    ginKey.setAttribute('aria-pressed', String(gin));
    go.disabled = t === 0;
    go.textContent = t < 0 ? `Take off ${name(p)}` : `Add for ${name(p)}`;
    who.replaceChildren(...Array.from({ length: S.players }, (_, q) => h('button', { 'aria-pressed': String(q === p), on: { click: () => { p = q; draw(); } } }, name(q))));
  };
  const key = (k) => {
    if (typeof k === 'number') { if (cur.length < 4) cur = String(+(cur + k)); }
    else if (k === '+' || k === '-') { if (cur) { terms.push(sign * +cur); cur = ''; } sign = k === '+' ? 1 : -1; }
    else if (k === 'back') {
      if (cur) cur = cur.slice(0, -1);
      else if (terms.length) { const last = terms.pop(); sign = last < 0 ? -1 : 1; cur = String(Math.abs(last)); }   // back into the figure before
      else sign = 1;
    }
    else if (k === 'clear') { terms = []; cur = ''; sign = 1; gin = false; }
    else if (k === 'gin') gin = !gin;
    draw(k !== 'back' && k !== 'clear');
  };
  const commit = () => {
    const t = total(); if (!t) return;
    const before = work(S);
    S.entries.push(gin && t > 0 ? { p, pts: t, gin: true } : { p, pts: t }); save(); d.close(); paint();
    // Say what just happened, with a way straight back; a game won gets a little more.
    const after = work(S), wonNow = after.winners.map((x, g) => (x !== -1 && before.winners[g] === -1 ? g : -1)).filter((g) => g >= 0);
    if (wonNow.length) { party(); if (after.over) scrollTo({ top: 0, behavior: 'smooth' }); }
    toast(wonNow.length ? `${name(p)} won ${after.n > 1 ? 'game ' + wonNow.map((g) => g + 1).join(' and ') : 'the game'}` : `${t > 0 ? '+' : '−'}${Math.abs(t)} for ${name(p)}`, 'Undo', undo);
  };
  go.onclick = commit; plus.onclick = () => key('+'); minus.onclick = () => key('-'); ginKey.onclick = () => key('gin');
  const n = (x) => h('button', { on: { click: () => key(x) } }, String(x));
  const d = h('dialog', { class: 'keys', 'aria-label': 'Points for the hand', tabindex: '-1', autofocus: '' },
    h('div', { class: 'tape' }, sum, tot), who,
    h('div', { class: 'grid' },
      n(7), n(8), n(9), h('button', { class: 'fn', 'aria-label': 'Rub out the last figure', on: { click: () => key('back') } }, '⌫'),
      n(4), n(5), n(6), minus,
      n(1), n(2), n(3), plus,
      h('button', { class: 'fn', 'aria-label': 'Clear and start again', on: { click: () => key('clear') } }, 'C'), n(0), ginKey),
    h('div', { class: 'btns' }, h('button', { class: 'ghost', on: { click: () => d.close() } }, 'Cancel'), go));
  d.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) key(+e.key); else if (e.key === '+' || e.key === '-') key(e.key); else if (e.key === 'Backspace') key('back');
    else if (e.key.toLowerCase() === 'g') key('gin'); else if (e.key === 'Enter') { e.preventDefault(); commit(); }
  });
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
  d.addEventListener('close', () => d.remove());
  draw(); document.body.append(d); d.showModal();
}
function undo() { if (S.entries.length) { const e = S.entries.pop(); save(); paint(); toast(`Took off ${e.pts > 0 ? '+' : '−'}${Math.abs(e.pts)} for ${name(e.p)}`); } }
$('#undo').onclick = undo;
function party() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 26; i++) {
    const c = h('div', { class: 'confetti', 'aria-hidden': 'true' }, ['♠', '♥', '♦', '♣', '🎉', '✨'][i % 6]);
    c.style.left = Math.random() * 100 + 'vw'; c.style.color = ['#c8102e', 'var(--ink)', '#f2c14e', '#1f8a5b'][i % 4];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.append(c); setTimeout(() => c.remove(), 3800);
  }
}

/* ---------- the sheet ---------- */
function paintSheet(w) {
  const pad = $('#pad');
  $('#empty').hidden = w.rows.length > 0; pad.hidden = !w.rows.length; $('#sheetHint').hidden = !w.rows.length;
  $('#sheetTitle').textContent = (S.mode === 'hollywood' ? 'Hollywood' : 'Single game') + ' to ' + S.target;
  if (!w.rows.length) { pad.replaceChildren(); return; }
  const tight = w.n * w.P > 6;
  const each = (fn) => Array.from({ length: w.n }, (_, g) => Array.from({ length: w.P }, (_, p) => fn(g, p)));
  // As on a paper sheet, every column fills from its own top: a player's first score in a game is on the first
  // line of that column, whichever hand it was. A line is the running total, with what was added small under it.
  const cols = each(() => []);
  w.rows.forEach((r) => { for (const g in r.cells) cols[g][r.p].push({ total: r.cells[g], r }); });
  const lines = Math.max(1, ...cols.flat().map((c) => c.length)), newest = w.rows[w.rows.length - 1];
  const head = h('thead', {},
    h('tr', { class: 'g' }, h('th', { class: 'h' }), Array.from({ length: w.n }, (_, g) =>
      h('th', { colspan: w.P, class: 'first' + (w.winners[g] !== -1 ? ' done' : '') }, (w.n > 1 ? `Game ${g + 1}` : 'Game') + (w.winners[g] !== -1 ? ' 🏆' : '')))),
    h('tr', { class: 'n' }, h('th', { class: 'h' }), each((g, p) => h('th', { class: p === 0 ? 'first' : '' }, name(p)))));
  const body = h('tbody', {}, Array.from({ length: lines }, (_, i) => h('tr', {}, h('td', { class: 'h' }, String(i + 1)),
    each((g, p) => {
      const c = cols[g][p][i];
      if (!c) return h('td', { class: p === 0 ? 'first' : '' });
      return h('td', { class: (p === 0 ? 'first ' : '') + 'has' + (c.r.pts < 0 ? ' neg' : '') + (c.r === newest ? ' new' : ''), title: 'Tap to take this hand off the sheet', on: { click: () => removeRow(c.r) } },
        h('b', {}, String(c.total)), h('small', {}, (c.r.pts > 0 ? '+' : '−') + Math.abs(c.r.pts), c.r.gin ? h('i', {}, ' gin') : null));
    }))));
  const foot = h('tfoot', {},
    h('tr', {}, h('td', { class: 'h' }), each((g, p) => h('td', { class: (p === 0 ? 'first' : '') + (w.winners[g] === p ? ' win' : '') }, String(w.totals[g][p])))),
    h('tr', { class: 'bx' }, h('td', { class: 'h' }, 'boxes'), each((g, p) => h('td', { class: p === 0 ? 'first' : '' }, String(w.boxes[g][p])))));
  pad.classList.toggle('tight', tight);
  pad.replaceChildren(head, body, foot);
}
function removeRow(r) {
  const games = Object.keys(r.cells).map((g) => +g + 1), where = w0().n > 1 && games.length ? ` It is in game${games.length > 1 ? 's' : ''} ${games.join(' and ').replace(/ and (\d) and /, ', $1 and ')}.` : '';
  const d = sheet('Take it off the sheet?', `${r.pts > 0 ? '+' : '−'}${Math.abs(r.pts)} for ${name(r.p)}.${where} Everything after it is added up again.`,
    h('button', { class: 'ghost', on: { click: () => d.close() } }, 'Keep it'),
    h('button', { class: 'go', on: { click: () => { S.entries.splice(r.at, 1); save(); d.close(); paint(); } } }, 'Take it off'));
}
const w0 = () => work(S);

/* ---------- what it comes to ---------- */
function paintReck(w) {
  const box = $('#reck'), working = [];
  $('#reckPanel').hidden = !w.games.some(Boolean);
  if (!w.games.some(Boolean)) return;
  const ln = (a, b, strong) => h('div', { class: 'ln' }, h('span', {}, strong ? h('b', {}, a) : a), h('span', {}, b));
  w.games.forEach((g, i) => {
    if (!g) return;
    working.push(h('div', { class: 'gt' }, (w.n > 1 ? `Game ${i + 1}: ` : '') + `${name(g.w)} won, ${w.totals[i].join(' to ')}`));
    g.owes.forEach((o) => {
      if (w.P > 2) working.push(ln(`From ${name(o.l)}`, String(o.net), true));
      working.push(ln(`Points, ${w.totals[i][g.w]} to ${w.totals[i][o.l]}`, String(o.pointsBy)),
        ln('Game bonus' + (o.shut && S.shutout === 'bonus' ? ', doubled for the shutout' : ''), '+' + o.bonus),
        ln(`Boxes, ${w.boxes[i][g.w]} to ${w.boxes[i][o.l]} at ${S.box}`, (o.boxBy < 0 ? '−' : '+') + Math.abs(o.boxBy * S.box)));
      if (o.shut && S.shutout === 'total') working.push(ln('Doubled for the shutout', '×2'));
      if (w.P === 2) working.push(ln(`${name(g.w)} by`, String(o.net), true));
    });
  });
  const open = box.querySelector('details') ? box.querySelector('details').open : false;
  box.replaceChildren(...pays(w).map((line) => h('div', { class: 'pay' }, line)),
    h('small', {}, (S.cents > 0 ? `At ${rate()}` : 'In points') + (w.over ? '.' : ', for the games finished so far.')),
    h('details', { class: 'work', open }, h('summary', {}, 'How that is worked out'), working));
}

/* ---------- set up ---------- */
function sheet(title, why, ...btns) {
  const d = h('dialog', { 'aria-label': title, tabindex: '-1', autofocus: '' }, h('h3', {}, title), why ? h('p', { class: 'why' }, why) : null, h('div', { class: 'btns' }, btns));
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
  d.addEventListener('close', () => d.remove());
  document.body.append(d); d.showModal();
  return d;
}
function setUp() {
  const d = h('dialog', { 'aria-label': 'Set up the sheet', tabindex: '-1', autofocus: '' });
  const chips = (label, opts, get, set) => {
    const row = h('div', { class: 'chips' });
    const draw = () => row.replaceChildren(...opts.map(([v, t]) => h('button', { 'aria-pressed': String(get() === v), on: { click: () => { set(v); save(); draw(); paint(); } } }, t)));
    draw();
    return [h('p', { class: 'label' }, label), row];
  };
  const num = (label, key, max) => h('label', {}, label, h('input', { class: 'num', type: 'number', inputmode: 'numeric', min: 0, max, value: S[key],
    on: { input: (e) => { const v = Math.round(+e.target.value); if (Number.isFinite(v) && v >= 0 && v <= max) { S[key] = v; save(); paint(); } } } }));
  const awake = !('wakeLock' in navigator) ? null : h('button', { class: 'setting', role: 'switch', 'aria-checked': String(!!S.awake), style: 'margin-top:16px',
    on: { click: (e) => { S.awake = !S.awake; save(); e.currentTarget.setAttribute('aria-checked', String(S.awake)); stayAwake(); } } },
    h('span', { class: 't' }, h('b', {}, 'Keep the screen on'), h('span', {}, 'So the phone does not go dark on the table between hands.')), h('span', { class: 'switch' }));
  const names = h('div', { class: 'names' });
  const drawNames = () => names.replaceChildren(...Array.from({ length: S.players }, (_, p) => h('input', { type: 'text', maxlength: 14, value: S.names[p], 'aria-label': `Name ${p + 1}`, autocomplete: 'off',
    on: { input: (e) => { S.names[p] = e.target.value.trim().slice(0, 14) || DEFAULT_NAMES[p]; save(); paint(); } } })));
  drawNames();
  d.append(h('h3', {}, 'Set up'),
    h('p', { class: 'why' }, 'Change anything at any time; the sheet is added up again from the hands.'),
    h('div', { style: 'margin-top:16px' },
      chips('Players', [[2, 'Two'], [3, 'Three']], () => S.players, (v) => { S.players = v; drawNames(); }),
      h('p', { class: 'label' }, 'Names'), names,
      chips('Game', [['hollywood', 'Hollywood'], ['single', 'Single game']], () => S.mode, (v) => { S.mode = v; }),
      chips('Play to', [[100, '100'], [150, '150'], [200, '200'], [250, '250'], [300, '300']], () => S.target, (v) => { S.target = v; }),
      chips('Money a point', [[0, 'None'], [1, '1¢'], [5, '5¢'], [10, '10¢'], [25, '25¢'], [100, '$1']], () => S.cents, (v) => { S.cents = v; }),
      h('p', { class: 'label' }, 'Bonuses'),
      h('div', { class: 'scoregrid' }, num('For winning a game', 'game', 1000), num('For each hand won (a box)', 'box', 500)),
      chips('A shutout (a player never scored in a game)', [['bonus', 'Doubles the game bonus'], ['total', 'Doubles everything'], ['none', 'Pays no more']], () => S.shutout, (v) => { S.shutout = v; })),
    awake,
    h('div', { class: 'btns' }, h('button', { class: 'go', on: { click: () => d.close() } }, 'Done')));
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
  d.addEventListener('close', () => d.remove());
  document.body.append(d); d.showModal();
}
$('#setupBtn').onclick = setUp;
// A phone lying on the table goes dark between hands. With this on, it stays lit while the pad is showing.
let lock = null;
async function stayAwake() {
  try {
    if (S.awake && !lock && 'wakeLock' in navigator && !document.hidden) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
    else if (!S.awake && lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}
document.addEventListener('visibilitychange', stayAwake);
// A new sheet is one tap, and one tap to get the old one back.
function newSheet() {
  if (!S.entries.length) return;
  const old = S.entries; S.entries = []; save(); paint(); scrollTo({ top: 0, behavior: 'smooth' });
  toast('New sheet started', 'Put the old one back', () => { S.entries = old; save(); paint(); });
}
$('#fresh').onclick = newSheet;
let toastTimer;
function toast(msg, label, fn) {
  let t = $('#toast');
  if (!t) { t = h('div', { id: 'toast', role: 'status', 'aria-live': 'polite' }); document.body.append(t); }
  t.replaceChildren(h('span', {}, msg), label ? h('button', { on: { click: () => { t.classList.remove('on'); fn(); } } }, label) : null);
  t.classList.toggle('act', !!label); t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), label ? 5000 : 2600);
}

function paint() { const w = work(S); paintAdd(w); paintSheet(w); paintReck(w); }
paint(); stayAwake();
// Kept for a place with no signal: once opened, the pad opens again without one (see sw.js).
if ('serviceWorker' in navigator && !['localhost', '127.0.0.1'].includes(location.hostname)) {
  navigator.serviceWorker.register('/games/sw.js', { scope: '/games/' }).catch(() => {});
  if ('caches' in window) caches.open('ace-pad-v1').then((c) => c.addAll(['/games/score/', '/games/room.css?v=7', '/games/icons/favicon-32.png?v=3'])).catch(() => {});
}
window.AceScore = { work };   // for the tests
})();
</script>
