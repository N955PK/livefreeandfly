name: Snow roads

# Nevada road status for the snow page. Nevada's feed needs a key (the NV511_KEY secret), so it is read here and
# published to its own branch for the page to pick up; California's feed is open and the page reads it directly.
on:
  # The Snow collect workflow now does this every five minutes; this one is kept to run by hand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snow-roads
  cancel-in-progress: true

jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: snow/tahoe_snow

      # A failed read leaves the last file in place; the page stops showing it once it is 45 minutes old.
      - name: Read Nevada 511
        working-directory: snow
        env:
          NV511_KEY: ${{ secrets.NV511_KEY }}
        run: python3 -m tahoe_snow.sources.nv511 "$RUNNER_TEMP/nevada.json" || echo "::warning::Nevada 511 could not be read"

      # The branch holds one commit: the latest status.
      - name: Publish to the roads branch
        run: |
          [ -s "$RUNNER_TEMP/nevada.json" ] || exit 0
          out="$(mktemp -d)"
          cp "$RUNNER_TEMP/nevada.json" "$out/"
          cd "$out"
          git init -q -b snow-roads
          git config user.name "snow-roads"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Nevada road status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" snow-roads
