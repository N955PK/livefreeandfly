name: Snow collect

# GitHub fires a scheduled workflow on this repository hours apart, however often the schedule asks, so the live
# status the page shows (lifts at the resorts a browser cannot read, Nevada's roads) went stale and the records kept
# for checking the page's predictions had one line a day. This workflow does not wait to be fired: one job runs for
# most of six hours, doing a pass every five minutes by day and every fifteen at night, then starts the next run
# itself. The schedule below only restarts the chain if it ever breaks; while a run is going, a second one waits.
#
# Each pass:
#   1. reads the resorts' lift pages and Nevada's roads and publishes them for the page (snow-lifts, snow-roads);
#   2. appends everything live the page reads and shows to the history branch (see tahoe_snow/collect.py);
#   3. every third pass, adds to the lift-hold and resort-report records (snow-holds, snow-reports), and gathers every
#      avalanche zone's forecast into one file for the page to keep for when there is no signal (snow-avy).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snow-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: snow/tahoe_snow

      - name: Install the readers
        run: pip install curl_cffi==0.15.0

      - name: Collect until the job is nearly out of time
        env:
          NV511_KEY: ${{ secrets.NV511_KEY }}
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -u +e   # a pass that fails in one place carries on to the next; nothing here should end the job
          echo "COLLECT_BEGAN=$(date +%s)" >> "$GITHUB_ENV"
          code="$PWD/snow" work="$RUNNER_TEMP/collect"
          mkdir -p "$work/lifts" "$work/roads" "$work/logs" "$work/avy"
          git config --global user.name "snow-collect"
          git config --global user.email "actions@users.noreply.github.com"

          # The history branch is the one branch here that keeps its past: each pass adds a commit.
          if git clone -q --depth=1 --branch snow-history "$REMOTE" "$work/history" 2>/dev/null; then :; else
            mkdir -p "$work/history" && git -C "$work/history" init -q -b snow-history && git -C "$work/history" remote add origin "$REMOTE"
          fi
          # Start from what is published, so a source that fails keeps its last file.
          if git fetch -q --depth=1 origin snow-lifts 2>/dev/null; then git archive FETCH_HEAD | tar -x -C "$work/lifts"; fi
          if git fetch -q --depth=1 origin snow-avy 2>/dev/null; then git archive FETCH_HEAD | tar -x -C "$work/avy"; fi

          # One file as the only commit of a branch, as the page reads it.
          publish() {  # branch, folder, message
            local out; out="$(mktemp -d)"
            cp -r "$2"/. "$out/" && cd "$out" && git init -q -b "$1" && git add -A && git commit -q -m "$3" \
              && git push -q -f "$REMOTE" "$1"; cd "$code/.."; rm -rf "$out"
          }
          # A record kept as one growing file on its own branch.
          record() {  # branch, file, module
            local out; out="$(mktemp -d)"
            if git fetch -q --depth=1 origin "$1" 2>/dev/null; then git show "FETCH_HEAD:$2" > "$out/$2" 2>/dev/null || true; fi
            local before=0; [ -f "$out/$2" ] && before="$(wc -l < "$out/$2")"
            (cd "$code" && python3 -m "$3" "$out/$2") || echo "::warning::$3 failed"
            if [ -s "$out/$2" ] && [ "$(wc -l < "$out/$2")" -gt "$before" ]; then publish "$1" "$out" "$1 $(date -u +%Y-%m-%dT%H:%MZ)"; fi
            rm -rf "$out"
          }

          stop=$((SECONDS + 330 * 60)) pass=0
          while [ "$SECONDS" -lt "$stop" ]; do
            began=$SECONDS pass=$((pass + 1))
            hour=$((10#$(TZ=America/Los_Angeles date +%H)))
            cd "$code"
            python3 -m tahoe_snow.sources.resort_status "$work/lifts/resort_status.json" || echo "::warning::The resort status pages could not be read"
            python3 -m tahoe_snow.sources.homewood "$work/lifts/homewood.json" || echo "::warning::Homewood's snow report could not be read"
            python3 -m tahoe_snow.sources.boreal "$work/lifts/boreal.json" || echo "::warning::Boreal's lift and trail report could not be read"
            python3 -m tahoe_snow.sources.nv511 "$work/roads/nevada.json" || echo "::warning::Nevada 511 could not be read"
            cd ..
            publish snow-lifts "$work/lifts" "Lift status $(date -u +%Y-%m-%dT%H:%MZ)" || echo "::warning::Lift status was not published"
            if [ -s "$work/roads/nevada.json" ]; then publish snow-roads "$work/roads" "Nevada road status $(date -u +%Y-%m-%dT%H:%MZ)" || echo "::warning::Nevada roads were not published"; fi

            (cd "$code" && python3 -m tahoe_snow.collect "$work/history" --lifts "$work/lifts" --nevada "$work/roads/nevada.json") || echo "::warning::The history pass failed"
            (cd "$work/history" && git add -A && git commit -q -m "History $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin snow-history) || echo "::warning::The history was not pushed"

            if [ $((pass % 3)) -eq 1 ]; then
              record snow-holds holds.jsonl tahoe_snow.holds
              record snow-reports reports.jsonl tahoe_snow.reports
              # The avalanche file is rewritten only when a forecast has changed, and published only then.
              was="$(cksum "$work/avy/bundle.json" 2>/dev/null || true)"
              (cd "$code" && python3 -m tahoe_snow.avybundle "$work/avy") || echo "::warning::The avalanche forecasts could not be gathered"
              if [ -s "$work/avy/bundle.json" ] && [ "$(cksum "$work/avy/bundle.json")" != "$was" ]; then publish snow-avy "$work/avy" "Avalanche forecasts $(date -u +%Y-%m-%dT%H:%MZ)" || true; fi
            fi

            # Every five minutes from 5 am to 7 pm Pacific, when lifts and roads change; every fifteen overnight.
            if [ "$hour" -ge 5 ] && [ "$hour" -lt 19 ]; then every=300; else every=900; fi
            rest=$((every - (SECONDS - began)))
            if [ "$rest" -gt 0 ] && [ $((SECONDS + rest)) -lt "$stop" ]; then sleep "$rest"; else [ "$rest" -gt 0 ] && break; fi
          done
          echo "$pass passes"

      # Runs even if the loop above failed or was cancelled, so one bad run does not end the chain. A run that lasted
      # under ten minutes does not start another (something is broken, and the hourly schedule will try again), so a
      # fault cannot turn into a stream of runs. To stop the chain for good, disable this workflow.
      - name: Start the next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $(( $(date +%s) - ${COLLECT_BEGAN:-$(date +%s)} )) -ge 600 ]; then gh workflow run snow-collect.yml --repo "${{ github.repository }}" --ref main; else echo "Short run; leaving the restart to the schedule."; fi
