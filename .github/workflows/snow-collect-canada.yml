name: Snow collect, Canada

# The second collector: it builds the forecasts of Canada's regions and nothing else. It is a workflow of its own
# so that it keeps its own data branch (snow-data-canada: its regions' files, its own index and its own ledger of
# calls) and never rewrites the branch the first collector publishes; the page reads both indexes and takes each
# region from the branch that holds it. Lifts, roads, history and the avalanche file all stay with snow-collect.yml,
# which reads every resort whichever collector forecasts it.
#
# Like the first, it does not wait to be fired: one job runs for most of six hours, looking every ten minutes for
# a region that is due, then starts the next run itself. The schedule below only restarts the chain if it breaks.
# SNOW_COLLECTOR tells the code which regions are this collector's (see COLLECTOR in tahoe_snow/config.py).
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snow-collect-canada
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SNOW_COLLECTOR: canada
      DATA_BRANCH: snow-data-canada
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: snow

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: snow/requirements.txt

      - name: Install the forecast
        run: pip install -r snow/requirements.txt

      - name: Build forecasts until the job is nearly out of time
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -u +e   # a pass that fails in one place carries on to the next; nothing here should end the job
          echo "COLLECT_BEGAN=$(date +%s)" >> "$GITHUB_ENV"
          code="$PWD/snow"
          git config --global user.name "snow-collect"
          git config --global user.email "actions@users.noreply.github.com"

          # One folder as the only commit of a branch, as the page reads it.
          publish() {  # branch, folder, message
            local out; out="$(mktemp -d)"
            cp -r "$2"/. "$out/" && cd "$out" && git init -q -b "$1" && git add -A && git commit -q -m "$3" \
              && git push -q -f "$REMOTE" "$1"; cd "$code/.."; rm -rf "$out"
          }

          # The forecast, one region a pass: the one most overdue on its own hours, if any is. A region whose run fails
          # waits before it is tried again (half an hour, doubling to four hours: see pipeline.due) and the others are
          # built meanwhile. When there is no room in the allowance, or nothing can be published, nothing is tried for
          # half an hour; a try that works sets no wait, so regions with no file yet are built on consecutive passes.
          # The branch holds one commit: every one of this collector's regions' latest forecast, their index, and the
          # last three weeks of archive, which carries this collector's ledger and its note of failed runs.
          tried=-1800 mended=-1800
          forecast() {
            local published="" region out
            if [ $((SECONDS - tried)) -lt 1800 ]; then return 0; fi
            if git fetch -q --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then published=1
            elif [ "$(git ls-remote --exit-code origin "$DATA_BRANCH" >/dev/null 2>&1; echo $?)" != 2 ]; then
              # The branch could not be read, so publishing one region would drop the others. Try again next pass.
              echo "::warning::The published forecast could not be read"; return 0
            fi
            # Start from exactly what is published, so no file from an earlier pass is left behind.
            rm -rf "$code/data/forecast" "$code/data/index.json" "$code/data/forecast.json" "$code/data/scorecard.json" "$code/data/archive"
            mkdir -p "$code/data/archive"
            if [ -n "$published" ]; then git archive FETCH_HEAD | tar -x -C "$code/data" || true; fi
            region="$(cd "$code" && python3 -m tahoe_snow due)"
            if [ -z "$region" ]; then
              # Nothing to build: fill in any sensor readings a forecast went out without, no more than every half hour.
              if [ $((SECONDS - mended)) -lt 1800 ]; then return 0; fi
              mended=$SECONDS
              region="$(cd "$code" && python3 -m tahoe_snow mend | tail -n 1)"
              if [ -z "$region" ]; then return 0; fi
              echo "Sensor readings filled in for $region"
            else
              echo "Forecast due for $region"
              (cd "$code" && python3 -m tahoe_snow budget "$region") || { echo "::warning::Forecast skipped for $region: no room in the Open-Meteo allowance"; tried=$SECONDS; return 0; }
              if (cd "$code" && python3 -m tahoe_snow run "$region" && python3 -m tahoe_snow prune); then :; else
                # The failure is noted beside the ledger, so the region waits (half an hour, then longer each time)
                # while the others are built, and it is published below so the wait outlasts this job. With nothing
                # published yet there is nowhere to keep the note, so every region waits half an hour instead.
                echo "::error::The forecast run failed for $region"
                (cd "$code" && python3 -m tahoe_snow failed "$region") || true
                if [ ! -f "$code/data/index.json" ]; then tried=$SECONDS; return 0; fi
              fi
            fi
            out="$(mktemp -d)"
            cp "$code/data/index.json" "$out/" && cp -r "$code/data/forecast" "$out/forecast" && cp -r "$code/data/archive" "$out/archive" \
              && publish "$DATA_BRANCH" "$out" "Forecast data $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "::error::The forecast was not published"; tried=$SECONDS; }
            rm -rf "$out"
            (cd "$code" && python3 -m tahoe_snow usage --fail-over 0.9) || echo "::warning::The forecast is using most of the day's Open-Meteo allowance"
          }

          stop=$((SECONDS + 330 * 60)) pass=0
          while [ "$SECONDS" -lt "$stop" ]; do
            began=$SECONDS pass=$((pass + 1))
            forecast
            rest=$((600 - (SECONDS - began)))
            if [ "$rest" -gt 0 ] && [ $((SECONDS + rest)) -lt "$stop" ]; then sleep "$rest"; else [ "$rest" -gt 0 ] && break; fi
          done
          echo "$pass passes"

      # Runs even if the loop above failed or was cancelled, so one bad run does not end the chain. A run that lasted
      # under ten minutes does not start another (something is broken, and the hourly schedule will try again). To
      # stop the chain for good, disable this workflow.
      - name: Start the next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $(( $(date +%s) - ${COLLECT_BEGAN:-$(date +%s)} )) -ge 600 ]; then gh workflow run snow-collect-canada.yml --repo "${{ github.repository }}" --ref main; else echo "Short run; leaving the restart to the schedule."; fi
