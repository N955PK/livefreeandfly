name: Snow forecast

# A new forecast is due every three hours. GitHub delays and drops scheduled runs, so the schedule fires hourly and
# each firing runs the forecast only if the published one is old enough; a dropped firing then costs an hour, not three.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      only_if_due:
        description: Run only if the forecast is due, as a scheduled firing does
        type: boolean
        default: false
      season_only:
        description: Refresh only the season figures from the snow sensors (no forecast, no Open-Meteo calls)
        type: boolean
        default: false
      over_budget:
        description: Run the forecast even if it does not fit the day's Open-Meteo allowance
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snow-forecast
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      # A run started by hand goes ahead, unless it asks to be treated like a scheduled one. A scheduled one goes
      # ahead when the data branch was last published more than 2.5 hours ago (or never), which with hourly firings
      # works out to every three hours.
      - id: age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published="$(gh api "repos/${{ github.repository }}/branches/snow-data" -q .commit.commit.committer.date 2>/dev/null || true)"
          if [ -n "$published" ]; then minutes=$(( ( $(date -u +%s) - $(date -u -d "$published" +%s) ) / 60 )); else minutes=99999; fi
          run=false
          if [ "$minutes" -ge 150 ]; then run=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.only_if_due }}" != "true" ]; then run=true; fi
          if [ "${{ inputs.season_only }}" = "true" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Forecast last published ${published:-never} (${minutes} minutes ago); run=$run" | tee -a "$GITHUB_STEP_SUMMARY"

  # Every firing during lift hours notes which lifts the resorts have on hold, beside the wind the forecast has for
  # that hour, on a branch of its own. The outlook's wind thresholds are set from this record.
  holds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: snow/tahoe_snow

      - name: Record lift holds
        run: |
          out="$(mktemp -d)"
          if git fetch --depth=1 origin snow-holds 2>/dev/null; then git show FETCH_HEAD:holds.jsonl > "$out/holds.jsonl" || true; fi
          before="$(wc -l < "$out/holds.jsonl" 2>/dev/null || echo 0)"
          (cd snow && python3 -m tahoe_snow.holds "$out/holds.jsonl") || echo "::warning::Lift holds could not be read"
          [ -s "$out/holds.jsonl" ] && [ "$(wc -l < "$out/holds.jsonl")" -gt "$before" ] || exit 0
          cd "$out"
          git init -q -b snow-holds
          git config user.name "snow-holds"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Lift holds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" snow-holds

  forecast:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: snow/requirements.txt

      - name: Install
        run: pip install -r snow/requirements.txt

      - name: Restore the forecast archive from the data branch
        run: |
          mkdir -p snow/data/archive
          if git fetch --depth=1 origin snow-data; then
            git archive FETCH_HEAD archive 2>/dev/null | tar -x -C snow/data || true
          fi

      # The ledger of past runs came back with the archive. A scheduled run goes ahead until Open-Meteo has refused
      # requests, then waits for room; a run started by hand has to fit the day's allowance unless told otherwise.
      - name: Check there is room in the data budget
        id: budget
        working-directory: snow
        run: |
          strict=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then strict="--by-hand"; fi
          if [ "${{ inputs.over_budget }}" = "true" ] || python -m tahoe_snow budget $strict; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "::warning::Forecast skipped: no room in the Open-Meteo allowance"; fi

      - name: Run the forecast
        if: steps.budget.outputs.go == 'true'
        working-directory: snow
        run: |
          python -m tahoe_snow run
          python -m tahoe_snow prune

      # The data branch holds one commit: the latest forecast and the last three weeks of archive.
      - name: Publish to the data branch
        if: steps.budget.outputs.go == 'true'
        run: |
          out="$(mktemp -d)"
          cp snow/data/forecast.json snow/data/scorecard.json "$out/"
          cp -r snow/data/archive "$out/archive"
          cd "$out"
          git init -q -b snow-data
          git config user.name "snow-forecast"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecast data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" snow-data

      # Last, so the forecast is published either way; a failure here sends the repository owner an email.
      - name: Check the data budget
        if: steps.budget.outputs.go == 'true'
        working-directory: snow
        run: python -m tahoe_snow usage --fail-over 0.9

  # The season figures come from the snow sensors alone, so they can be brought up to date without a forecast run.
  # The data branch keeps the date of the forecast it holds, so the next forecast still comes due on time.
  season:
    if: github.event_name == 'workflow_dispatch' && inputs.season_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: snow/requirements.txt

      - name: Install
        run: pip install -r snow/requirements.txt

      - name: Bring the published data back
        run: |
          mkdir -p snow/data
          git fetch --depth=1 origin snow-data
          git archive FETCH_HEAD | tar -x -C snow/data
          echo "FORECAST_DATE=$(git log -1 --format=%cI FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Refresh the season figures
        working-directory: snow
        run: python -m tahoe_snow season

      - name: Publish to the data branch
        run: |
          out="$(mktemp -d)"
          cp snow/data/forecast.json snow/data/scorecard.json "$out/"
          cp -r snow/data/archive "$out/archive"
          cd "$out"
          git init -q -b snow-data
          git config user.name "snow-forecast"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          GIT_AUTHOR_DATE="$FORECAST_DATE" GIT_COMMITTER_DATE="$FORECAST_DATE" git commit -q -m "Forecast data, season refreshed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" snow-data
