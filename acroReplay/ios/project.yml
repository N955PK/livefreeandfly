name: WingRock
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  WingRock:
    type: application
    platform: iOS
    sources:
      - path: WingRock
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: WingRock/Info.plist
      properties:
        CFBundleDisplayName: WingRock
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: WingRock listens for the OnFlight Hub's flight-data broadcast on the Hub's Wi-Fi network.
        NSLocationWhenInUseUsageDescription: WingRock uses your position to place the aerobatic box at the judges' location.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.livefreeandfly.wingrock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R6P52BJ2K9
