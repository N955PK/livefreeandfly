<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>WingRock</title>
<link rel="stylesheet" href="./app.css">
<script>
  // Inside the iOS shell, surface page errors in the native log (WKWebView has no visible console).
  (function () {
    const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.acro;
    if (!native) return;
    const report = (msg) => native.postMessage('log: ' + msg);
    window.addEventListener('error', (e) => report(`${e.message} @ ${e.filename}:${e.lineno}`));
    window.addEventListener('unhandledrejection', (e) => report('unhandled: ' + (e.reason && e.reason.stack || e.reason)));
    const origError = console.error.bind(console);
    console.error = (...a) => { report(a.map(String).join(' ')); origError(...a); };
  })();
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
</head>
<body>
<canvas id="view"></canvas>

<section id="hud" class="glass" aria-label="flight data">
  <div id="status" class="badge"><span>connecting…</span></div>
  <div class="stat"><span class="k">LOAD</span><span class="v"><b id="nz">-.-</b><em>G</em></span></div>
  <div class="stat"><span class="k">ALTITUDE</span><span class="v"><b id="alt">----</b><em id="alt-u">ft</em></span></div>
  <div class="minis" id="minis">
    <svg id="plan" viewBox="0 0 100 100" aria-label="position in box, top-down">
      <rect class="mbox" x="25" y="25" width="50" height="50" rx="2"/>
      <line class="mline" x1="25" y1="50" x2="75" y2="50"/>
      <line class="mline" x1="50" y1="25" x2="50" y2="75"/>
      <line id="plan-hdg" class="mhdg" x1="50" y1="50" x2="50" y2="38"/>
      <circle id="plan-dot" class="mdot" cx="50" cy="50" r="5"/>
    </svg>
    <svg id="vert" viewBox="0 0 30 100" aria-label="altitude in box">
      <rect class="mband" x="6" y="30" width="18" height="40"/>
      <line class="mline strong" x1="4" y1="30" x2="26" y2="30"/>
      <line class="mline strong" x1="4" y1="70" x2="26" y2="70"/>
      <circle id="vert-dot" class="mdot" cx="15" cy="50" r="5"/>
    </svg>
  </div>
  <div id="boxstat" class="chip"></div>
</section>

<div id="zoom">
  <button class="round" id="zoom-in" aria-label="zoom in">+</button>
  <button class="round" id="zoom-out" aria-label="zoom out">−</button>
</div>

<nav id="controls">
  <div class="seg" role="group" aria-label="camera">
    <button data-cam="judge">Judge</button>
    <button data-cam="orbit" class="on">Orbit</button>
    <button data-cam="chase">Chase</button>
  </div>
  <button class="tool" id="clear">Clear</button>
  <button class="tool" id="box-toggle">Box</button>
  <button class="tool" id="ground-toggle">Sat</button>
</nav>

<section id="boxpanel" class="panel glass hidden" aria-label="aerobatic box">
  <header class="phead">
    <h2>Aerobatic box</h2>
    <button class="close" id="box-close" aria-label="close">×</button>
  </header>
  <div class="ptabs">
    <button class="ptab on" data-mode="aircraft">From aircraft</button>
    <button class="ptab" data-mode="judges">From judges</button>
  </div>

  <div id="mode-aircraft" class="pmode">
    <p class="hint">Fly into the box along its main axis and tap as you cross the middle of the entry edge. The box extends ahead of you; its axis follows your flight path.</p>
    <button class="primary" id="box-set">Set entry edge here</button>
    <p class="hint" id="a-msg"></p>
    <label class="field inline"><span>Judges</span>
      <select id="box-side"><option value="right">on my right</option><option value="left">on my left</option></select>
    </label>
  </div>

  <div id="mode-judges" class="pmode hidden">
    <div class="grid2">
      <label class="field"><span>Judges latitude</span><div class="input"><input id="j-lat" type="number" step="0.00001" placeholder="36.93575"><em>°</em></div></label>
      <label class="field"><span>Judges longitude</span><div class="input"><input id="j-lon" type="number" step="0.00001" placeholder="-121.78975"><em>°</em></div></label>
      <label class="field"><span>Facing (true)</span><div class="input"><input id="j-hdg" type="number" step="1" placeholder="into the box"><em>°</em></div></label>
      <label class="field"><span>Setback</span><div class="input"><input id="j-set" type="number" data-len step="10"><em class="u-len">m</em></div></label>
    </div>
    <div class="row">
      <button class="secondary" id="j-here">Use my location</button>
      <button class="secondary" id="j-map">Pick on map</button>
    </div>
    <button class="primary" id="j-place">Place box</button>
    <p class="hint" id="j-msg"></p>
  </div>

  <h3>Dimensions</h3>
  <div class="grid2">
    <label class="field"><span>Width</span><div class="input"><input id="box-w" type="number" data-len step="50"><em class="u-len">m</em></div></label>
    <label class="field"><span>Depth</span><div class="input"><input id="box-d" type="number" data-len step="50"><em class="u-len">m</em></div></label>
    <label class="field"><span>Floor</span><div class="input"><input id="box-f" type="number" data-len step="100"><em class="u-len">ft</em></div></label>
    <label class="field"><span>Ceiling</span><div class="input"><input id="box-c" type="number" data-len step="100"><em class="u-len">ft</em></div></label>
  </div>
  <h3>Settings</h3>
  <label class="field inline"><span>Units (everything)</span>
    <div class="seg small" id="units"><button data-unit="ft">ft</button><button data-unit="m">m</button></div>
  </label>
  <footer class="pfoot">
    <p id="box-info" class="hint"></p>
    <button class="secondary danger" id="box-clear">Clear box</button>
  </footer>
</section>

<div id="pickbar" class="glass hidden"><span id="pick-msg"></span><div class="pickbtns"><button class="secondary small" id="pick-redo">Redo</button><button class="primary small" id="pick-done">Done</button></div></div>
<div id="attribution"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
