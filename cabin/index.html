<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="robots" content="noindex">
<title>ski/lease</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.v4.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.v4.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.v4.png">
<style>
:root{
  --bg:#eef1f4; --ink:#0a0e13; --dim:#55616c; --line:rgba(10,14,19,.16);
  --accent:#A31F34; --accent-ink:#A31F34; --panel:rgba(255,255,255,.72); --sheet:#f7f9fa;
  --pos:#0b7d5e; --neg:#a85a00; --field:#ffffff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e13; --ink:#e9edf1; --dim:#8B959E; --line:rgba(233,237,241,.14);
    --accent-ink:#ef6f81; --panel:rgba(16,22,29,.6); --sheet:#10161d;
    --pos:#39d0a4; --neg:#ffa32e; --field:#0a0e13;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e13; --ink:#e9edf1; --dim:#8B959E; --line:rgba(233,237,241,.14);
  --accent-ink:#ef6f81; --panel:rgba(16,22,29,.6); --sheet:#10161d;
  --pos:#39d0a4; --neg:#ffa32e; --field:#0a0e13;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  min-height:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
html,body,button,a,label,input,select,textarea{touch-action:manipulation}
button,a.btn,label.btn,.chip,.tabs,.legend,.dow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active,a.btn:active,label.btn:active{opacity:.6}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:8px}

/* ---- frame ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:620px;margin:0 auto;padding:14px 18px 10px}
.brand{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--ink);text-decoration:none}
.brand .slash{color:var(--accent-ink);font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);min-height:40px;padding:0 2px 0 8px;border-radius:999px}
.who[hidden]{display:none}
main{max-width:620px;margin:0 auto;padding:6px 18px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{font-family:var(--mono);font-size:13px;letter-spacing:.05em;padding:16px 4px 15px;color:var(--dim);
  border-top:2px solid transparent;margin-top:-1px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

/* ---- type ---- */
h1{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.01em;line-height:1.2;margin-top:10px}
h2{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.04em;margin:30px 0 10px}
.sub{color:var(--dim);font-size:14px;margin-top:4px}
.demo{font-size:12.5px;color:var(--dim);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}

/* ---- member chip ---- */
.chip{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  font-family:var(--mono);font-size:11px;font-weight:700;color:#0a0e13;letter-spacing:0}
.chip.sm{width:12px;height:12px;font-size:7.5px;line-height:1}
.chip.emo{font-size:16px}
.chip.lg{width:68px;height:68px;font-size:23px}
.chip.lg.emo{font-size:36px}
.ava{display:flex;align-items:center;gap:14px}
.ava .btns{display:flex;flex-wrap:wrap;gap:8px}
.ava label{margin:0}
.emo-row,.sw-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.emo-row button{width:42px;height:42px;font-size:22px;border:1px solid var(--line);border-radius:10px}
.sw-row button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.sw-row button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--sheet)}
input[type="hidden"],input[hidden]{display:none}
a.btn{text-decoration:none}
.pay-btns{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px 14px}
.note{font-size:13px;color:var(--dim);margin:8px 2px 0}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--accent-ink);border:1px solid currentColor;border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.guest-add{display:flex;gap:8px;margin-top:8px}
.guest-add input{flex:1;margin-top:0}
.pick button.plain{padding:0 14px}
.grp{display:flex;align-items:center;gap:10px;margin:24px 0 8px;font-family:var(--mono);font-size:14px;font-weight:600}
.grp .amt{margin-left:auto;font-weight:400}

/* ---- weekend strip ---- */
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.wk button{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 12px 11px;min-height:96px;
  display:flex;flex-direction:column;gap:2px}
.wk .d{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.03em}
.wk .n{font-size:12.5px;color:var(--dim)}
.wk .n.over{color:var(--neg)}
.wk .me{margin-top:auto;font-size:12.5px;color:var(--dim)}
.wk button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.wk button[aria-pressed="true"] .n,.wk button[aria-pressed="true"] .me{color:rgba(255,255,255,.86)}

/* ---- month ---- */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.mnav h2{margin:0}
.mnav button{font-family:var(--mono);font-size:18px;width:44px;height:40px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;padding-bottom:4px}
.day{position:relative;aspect-ratio:1/1.12;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:5px 5px 4px;display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
.day .num{font-family:var(--mono);font-size:12.5px;font-weight:600;line-height:1}
.day .cnt{position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1}
.day .dots{margin:auto -3px 0;display:flex;flex-wrap:wrap;gap:1px;max-height:25px;overflow:hidden}
.day .more{font-family:var(--mono);font-size:7.5px;font-weight:700;color:var(--dim);width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center}
.day.past{opacity:.5}
.day.today .num{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.day.mine{border-color:var(--accent);box-shadow:inset 0 -4px 0 var(--accent)}
.day.over .cnt{color:var(--neg);font-weight:700}
.blank{visibility:hidden}
.day.off{opacity:.3;border-style:dashed;background:none}
.day.out{opacity:.45}
.day.mineg{border-color:var(--accent);border-style:dashed}
.day.picked{outline:2px solid var(--accent-ink);outline-offset:-2px;background:rgba(163,31,52,.28)}
.pickbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;color:var(--dim)}
.pickbar span{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.stack .btn{width:100%}
.wk button[aria-disabled="true"]{opacity:.45}
.mnav button:disabled{opacity:.25;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:13px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .chip.sm{width:16px;height:16px;font-size:9px}

/* ---- lists ---- */
.list{list-style:none;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.rowi{display:flex;align-items:center;gap:12px;padding:12px 2px;width:100%;text-align:left;min-height:52px}
.rowi .grow{flex:1;min-width:0}
.rowi .t{display:block;overflow-wrap:anywhere}
.rowi .s{display:block;font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.rowi .amt{font-family:var(--mono);font-size:14px;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:2px}
.empty{color:var(--dim);font-size:14px;padding:14px 2px}

/* ---- money ---- */
.bal{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px}
.bal .l{font-size:14px;color:var(--dim)}
.bal .v{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.15}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;
  border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%}
.btn.quiet{border-color:transparent;background:none;color:var(--dim);font-weight:500}
.btn.danger{border-color:transparent;background:none;color:var(--neg);font-weight:500}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.actions.three{gap:8px}
.actions.three .btn{padding:0 6px;font-size:14px;white-space:nowrap}

/* ---- house ---- */
dl{border-top:1px solid var(--line);margin-top:16px}
dl div{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
dt{color:var(--dim);font-size:14px}
dd{overflow-wrap:anywhere;white-space:pre-line}
dd.code{font-family:var(--mono);letter-spacing:.06em}
.unset{color:var(--dim)}

/* ---- sheet ---- */
dialog{border:0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));background:var(--sheet);color:var(--ink);
  width:100%;max-width:620px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:90%;overflow:auto;
  border-top:1px solid var(--line)}
dialog{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
dialog input,dialog select,dialog textarea{min-width:0;max-width:100%}
input[type="date"]{-webkit-appearance:none;appearance:none;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
html:has(dialog[open]){overflow:hidden}
dialog::backdrop{background:rgba(5,8,11,.62);touch-action:none}
dialog[open]{animation:up .14s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
dialog:focus,dialog:focus-visible{outline:none}
#confirm{margin:auto;width:calc(100% - 36px);max-width:380px;border-radius:18px;border:1px solid var(--line);padding:20px 18px;max-height:80%}
dialog h2{margin:0 0 4px;font-size:17px}
label[hidden]{display:none}
div[hidden]{display:none}
label,legend{display:block;font-size:13.5px;color:var(--dim);margin-top:14px}
legend{padding:0;margin-bottom:8px}
fieldset{border:0;margin-top:14px}
input,select,textarea{display:block;width:100%;margin-top:5px;min-height:46px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--field);font-size:16px}
textarea{min-height:84px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border-radius:999px;
  border:1px solid var(--line);font-size:14px;color:var(--dim)}
.pick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.pick button[aria-pressed="false"] .chip{opacity:.3}
.pick-all{display:flex;gap:8px;margin:0 0 10px}
label.check{display:flex;align-items:center;gap:12px;color:var(--ink);font-size:15.5px;margin-top:18px}
input[type="checkbox"]{display:inline-block;width:24px;height:24px;min-height:24px;margin:0;padding:0;flex:0 0 auto;accent-color:var(--accent)}
.each,.err{font-size:13.5px;margin-top:10px;color:var(--dim)}
.err{color:var(--neg)}
.err:empty{display:none}
.step{display:flex;align-items:center;gap:14px;margin-top:6px}
.step button{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;font-size:20px;font-family:var(--mono)}
.step output{font-family:var(--mono);font-size:20px;min-width:24px;text-align:center}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:999px;max-width:88%;
  opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

.gate{max-width:420px;margin:12vh auto 0;padding:0 22px}
@media (min-width:700px){ .day{aspect-ratio:1/.9;padding:8px} .day .cnt{top:8px;right:9px} .chip.sm{width:18px;height:18px;font-size:10px} .day .dots{gap:2px;max-height:38px} .day .more{width:18px;height:18px;font-size:10px} }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">ski<span class="slash">/</span>lease</a>
  <button class="who" id="who" data-act="me-edit" aria-label="Change your name and details" hidden></button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div>
  <button data-act="tab" data-view="nights">Calendar</button>
  <button data-act="tab" data-view="money">Money</button>
  <button data-act="tab" data-view="house">House Info</button>
</div></nav>
<dialog id="sheet" tabindex="-1"></dialog>
<dialog id="confirm" tabindex="-1"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   Setup: paste your Supabase project URL and anon key here to go live.
   Left blank, the app runs on sample data kept in this browser only.
   The anon key is safe to publish; row-level security in schema.sql
   is what keeps house data to members.
------------------------------------------------------------------- */
const CONFIG = {
  supabaseUrl: 'https://lzbvkrqdrizgnwpbname.supabase.co',
  supabaseAnonKey: 'sb_publishable_AfcKk4cO5zTDNSsZThrRHA_kLq8YzYa'
};
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const LIVE = !!(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey);
const KEY = 'cabin-time-demo-v1';
const PALETTE = ['#39d0a4','#3aa8ff','#ffa32e','#d95ce8','#e8d34f','#8f9bff','#ff5c39','#5fd0e8','#b5e05a','#ff8fb1'];
const VIEWS = ['nights','money','house'];

const S = { me:null, members:[], stays:[], expenses:[], payments:[], house:{id:1}, month:null, view:'nights', sheet:null, gate:null };

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmtDay = s => parse(s).toLocaleDateString('en-US', {month:'short', day:'numeric'});
const fmtLong = s => parse(s).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
const money = c => (c < 0 ? '−' : '') + '$' + (Math.abs(c)/100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const toCents = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return Number.isFinite(n) ? Math.round(n*100) : 0; };
const member = id => S.members.find(m => m.id === id);
const first = m => m ? m.name.trim().split(/\s+/)[0] : 'Someone';
const active = () => S.members.filter(m => m.active !== false);
const isAdmin = () => !!(S.me && S.me.is_admin);
const initials = m => { const p = m.name.trim().split(/\s+/); return ((p[0]?.[0]||'') + (p[1]?.[0] || p[0]?.[1] || '')).toUpperCase(); };
const EMOJI = ['🎿','🏂','⛷️','🏔️','❄️','☃️','🌲','🔥','🐻','🦌','🐕','☕','🍺','🚠'];
const IMG_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/, HEX_RE = /^#[0-9a-f]{6}$/i;
function chip(m, sm, cls){
  if (!m) return '';
  const bg = HEX_RE.test(m.color || '') ? m.color : '#8B959E', a = m.avatar || '', c = cls ? ' ' + cls : '';
  if (sm) return `<span class="chip sm" style="background:${bg}" aria-hidden="true">${esc((m.name || '?').trim()[0].toUpperCase())}</span>`;
  if (IMG_RE.test(a)) return `<span class="chip${c}" style="background:${bg} center/cover url(${a})" aria-hidden="true"></span>`;
  if (a.startsWith('emoji:')) return `<span class="chip emo${c}" style="background:${bg}" aria-hidden="true">${esc(a.slice(6, 14))}</span>`;
  return `<span class="chip${c}" style="background:${bg}" aria-hidden="true">${esc(initials(m))}</span>`;
}
async function fileToAvatar(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const n = 128, cv = document.createElement('canvas'); cv.width = cv.height = n;
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    cv.getContext('2d').drawImage(img, (img.naturalWidth - side)/2, (img.naturalHeight - side)/2, side, side, 0, 0, n, n);
    return cv.toDataURL('image/jpeg', .82);
  } finally { URL.revokeObjectURL(url); }
}
const tel = p => String(p||'').replace(/[^0-9+]/g,'');
// US numbers show as (304) 482-2506 however they were typed; anything else is left alone.
function fmtPhone(p){
  const raw = String(p || '').trim(); let d = raw.replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') d = d.slice(1);
  return d.length === 10 && !/^\+(?!1)/.test(raw) ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : raw;
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- data: demo (this browser) ---------- */
function weekendFriday(from){ const t = from || today(), dow = t.getDay(); // Fri, Sat, Sun count as the current weekend
  const back = dow === 5 ? 0 : dow === 6 ? 1 : dow === 0 ? 2 : -((5 - dow));
  return addDays(t, -back); }

function seed(){
  const names = ['Priya Raman','Marcus Bell','Elena Ortiz','Tom Whitaker','Jules Fontaine','Wen Zhao'];
  const members = names.map((name,i) => ({ id:uid(), name, email:name.split(' ')[0].toLowerCase()+'@example.com',

const fullTimers = () => { const e = active().filter(m => !m.part_time); return e.length ? e : active(); };

function sharesOf(e){

const potExpenses = () => S.expenses.filter(e => e.from_pot && member(e.paid_by));

      ${!leasePaid(S.me) && col && col.venmo ? `<div class="pay-btns"><a class="btn small primary" href="${esc(venmoUrl(col, 'pay', leaseOf(S.me), 'Part-time lease: ' + S.me.name))}" target="_blank" rel="noopener">Pay ${esc(first(col))} on Venmo</a></div>` : ''}</li></ul>` : '';
  const pt0 = pot(), fullMe = !!(S.me && fullTimers().some(m => m.id === S.me.id)), n = fullTimers().length || 1;
  const cut = pt0.heads ? Math.ceil(pt0.withheld / pt0.heads) : 0, depBack = Math.max(0, pt0.each - cut), share = Math.floor((pt0.guests + pt0.leases) / n);
  const sees = isAdmin() || canMarkGuests() || pt0.paidOut;     // the pot's size stays with admins until it's paid out
  const backRow = (t, sub, v) => `<li><div class="rowi"><span class="grow"><span class="t">${t}</span>${sub ? `<span class="s">${sub}</span>` : ''}</span><span class="amt">${v}</span></div></li>`;
  const myCosts = (S.me && pt0.costs.mine[S.me.id]) || 0, net = depBack + (sees ? share : 0) - myCosts;
  const dueBack = fullMe ? `<h2>Due back to you at the end of the season</h2>
    <ul class="list">${pt0.each ? backRow('Security deposit', cut ? `${money(cut)} of your ${money(pt0.each)} was withheld.` : 'Paid up front. Comes back in full unless some is withheld.', money(depBack)) : ''}
      ${backRow('Share of guest fees and part-time leases', sees ? (pt0.paidOut ? '' : 'So far. It grows as more comes in.') : 'Worked out when the pot is paid out.', sees ? money(share) : 'At payout')}
      ${myCosts || pt0.costs.all ? backRow('Your share of house bills', 'Comes off what you get back.', money(-myCosts)) : ''}
      ${backRow(pt0.paidOut ? 'Paid out to you' : sees ? 'Total so far' : 'Deposit less house bills so far', pt0.paidOut ? 'It’s in your balance above.' : net < 0 ? 'House bills are ahead of what’s due back, so you’d owe this at payout.' : '', `<span class="${net < 0 ? 'neg' : ''}">${money(net)}</span>`)}</ul>` : '';
  const venmoNudge = S.me && !S.me.venmo ? `<div class="actions"><button class="btn" data-act="me-edit">Add your Venmo username</button></div>` : '';
  const balHtml = S.members.filter(m => m.active !== false || b[m.id]).map(m => `<li><div class="rowi">${chip(m)}
      <span class="grow"><span class="t">${esc(m.name)}${S.me && m.id === S.me.id ? ' (you)' : ''}</span>
        ${m.venmo ? `<span class="links"><a href="https://venmo.com/u/${encodeURIComponent(m.venmo)}" target="_blank" rel="noopener">Venmo @${esc(m.venmo)}</a></span>` : ''}</span>
      <span class="amt ${b[m.id] > 0 ? 'pos' : b[m.id] < 0 ? 'neg' : ''}">${b[m.id] > 0 ? '+' : ''}${money(b[m.id])}</span></div></li>`).join('');
  return `${demoNote()}<h1>House money</h1>
    <div class="bal"><div class="l">${head[0]}</div><div class="v ${head[2]}">${head[1]}</div>
      ${mine < 0 ? `<div class="actions"><button class="btn primary wide" data-act="settle-open">Settle up</button></div>`
        : mine > 0 ? `<div class="actions"><button class="btn wide" data-act="settle-open">See who owes you</button></div>` : ''}</div>
    <div class="actions three"><button class="btn${mine < 0 ? '' : ' primary'}" data-act="exp-new">Add expense</button><button class="btn" data-act="pay-blank">Add payment</button><button class="btn" data-act="history-open">History</button></div>${venmoNudge}
    ${myLease}
    <h2>Balances</h2><ul class="list">${balHtml}</ul>
    <h2>Guest fees</h2>${guestHtml}
    ${dueBack}`;
}

      <div><dt>Door code</dt>${v(h.door_code,'code')}</div>
      <div><dt>Wi-Fi</dt>${h.wifi_name ? `<dd>${esc(h.wifi_name)}${h.wifi_password ? `<br><span class="code" style="font-family:var(--mono)">${esc(h.wifi_password)}</span>` : ''}</dd>` : `<dd class="unset">Not set</dd>`}</div>

function viewGate(){
  if (S.gate === 'loading') return `<div class="gate"><p class="sub">Loading the house…</p></div>`;
  if (S.gate === 'error') return `<div class="gate"><h1>Can’t reach the house</h1><p class="sub">The data didn’t load. Check your connection, then try again.</p>
    ${S.errText ? `<p class="demo" style="margin-top:14px;overflow-wrap:anywhere">${esc(S.errText)}</p>` : ''}
    <div class="actions"><button class="btn primary" data-act="retry">Try again</button></div></div>`;
  if (S.gate === 'notmember') return `<div class="gate"><h1>You’re not on the lease list</h1>
    <p class="sub">${esc(sessionEmail)} isn’t a member yet. Ask someone in the house to add this email under House Info, then reload.</p>
    <div class="actions"><button class="btn quiet" data-act="signout">Sign out</button></div></div>`;
  return `<div class="gate"><h1>Sign in</h1>
    <p class="sub">Use the Google account the house has on file.</p>
    <div class="actions"><button class="btn primary wide" data-act="google">Continue with Google</button></div>
    <p class="err" id="err">${esc(S.authErr || '')}</p>
    <p class="note" style="margin-top:22px"><a href="privacy.html">Privacy policy</a></p></div>`;
}

function render(){
  const gated = !!S.gate;
  $('#tabs').hidden = gated;
  $('#who').hidden = gated || !S.me;
  $('#who').innerHTML = (!gated && S.me) ? `<span>${esc(first(S.me))}</span>${chip(S.me)}` : '';
  $('#main').innerHTML = gated ? viewGate() : S.view === 'money' ? viewMoney() : S.view === 'house' ? viewHouse() : viewNights();
  document.querySelectorAll('#tabs button').forEach(b => { if (b.dataset.view === S.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if (S.sheet && S.sheet.type === 'night' && $('#sheet').open) $('#sheet').innerHTML = sheetNight(S.sheet.night);
  if (S.sheet && S.sheet.type === 'settle' && $('#sheet').open) $('#sheet').innerHTML = sheetSettle();
  if (S.sheet && S.sheet.type === 'guests' && $('#sheet').open) $('#sheet').innerHTML = sheetGuests();
  if (S.sheet && S.sheet.type === 'pot' && $('#sheet').open) $('#sheet').innerHTML = sheetPot();
  if (S.sheet && S.sheet.type === 'history' && $('#sheet').open) $('#sheet').innerHTML = sheetHistory();
  if (S.sheet && S.sheet.type === 'bulk' && S.bulk && $('#sheet').open) $('#sheet').innerHTML = sheetBulk();
}

/* ---------- sheets ---------- */
function openSheet(html, state){ const d = $('#sheet'); S.sheet = state || {type:'form'}; d.innerHTML = html;
  // Opening a panel shouldn't highlight whichever button happens to come first.
  if (!d.open){ d.showModal(); if (!d.querySelector('[autofocus]')) d.focus(); }

function closeSheet(){ const d = $('#sheet'); if (d.open) d.close(); S.sheet = null; }

// The guest list editor for one of my nights, shared by the three states of the night panel.
function guestEditor(night, names, lead){
  const used = usedGuests(names);
  return `<label>${lead}</label>
      ${names.length ? `<ul class="list" style="margin-top:8px">${names.map((n, i) => `<li><div class="rowi"><span class="grow"><span class="t">${esc(n)}</span></span>
        <button class="btn small quiet" data-act="guest-remove" data-night="${night}" data-i="${i}" aria-label="Remove ${esc(n)}">Remove</button></div></li>`).join('')}</ul>` : ''}
      <form data-form="guest-add" data-night="${night}" class="guest-add"><input name="guest" maxlength="40" autocomplete="off" placeholder="Guest’s name" aria-label="Guest’s name"><button class="btn">Add guest</button></form>
      ${used.length ? `<div class="pick" style="margin-top:10px">${used.map(n => `<button type="button" class="plain" data-act="guest-quick" data-night="${night}" data-name="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>` : ''}
      <p class="err" id="err"></p>`;
}
function sheetNight(night){
  const st = staysOn(night), hc = headcount(night), cap = beds(), mine = myStay(night), present = !!(mine && !mine.host_away), col = collector();
  const who = st.length ? `<ul class="list" style="margin-top:14px">${st.map(s => { const m = member(s.member_id), g = guestNames(s).map(esc).join(', '); return `<li><div class="rowi">${chip(m)}
      <span class="grow"><span class="t">${s.host_away ? g : esc(m.name) + (s.guests ? ' with ' + g : '')}</span>
      ${s.host_away ? `<span class="s">Guest${s.guests > 1 ? 's' : ''} of ${esc(first(m))}, who isn’t staying</span>` : ''}
      ${s.note ? `<span class="s">${esc(s.note)}</span>` : ''}</span></div></li>`; }).join('')}</ul>`
    : `<p class="empty">Nobody’s signed up for this night.</p>`;
  const over = cap && hc > cap, names = mine ? guestNames(mine) : [];
  const fee = mine && names.length && col ? `<p class="each">Your guest${names.length > 1 ? 's pay' : ' pays'} ${esc(first(col))} directly.</p>` : '';
  const mineHtml = present ? `${guestEditor(night, names, 'Guests you’re bringing')}${fee}
      <label>Note for the house<input data-change="note" data-night="${night}" maxlength="80" value="${esc(mine.note||'')}" placeholder="Arriving late, bringing the dog…"></label>
      <div class="actions"><button class="btn" data-act="night-toggle" data-night="${night}">Remove my night</button>
      <button class="btn primary" data-act="sheet-close">Done</button></div>`
    : mine ? `<p class="each">You’re not staying this night, but your guest${names.length > 1 ? 's are' : ' is'}.</p>
      ${guestEditor(night, names, 'Your guests')}${fee}
      <div class="actions"><button class="btn" data-act="night-toggle" data-night="${night}">I’m in too</button>
      <button class="btn primary" data-act="sheet-close">Done</button></div>`
    : canBook(S.me, night) ? `<div class="actions"><button class="btn" data-act="sheet-close">Close</button>
      <button class="btn primary" data-act="night-toggle" data-night="${night}">I’m in</button></div>
      ${guestEditor(night, [], 'Or send a guest without staying yourself')}`
    : `<p class="each">This night is outside your part-time dates${myDates(S.me) ? `, ${myDates(S.me)}` : ''}. Ask the admin if that needs changing.</p>
      <div class="actions"><button class="btn" data-act="sheet-close">Close</button></div>`;
  return `<h2>${fmtLong(night)}</h2>
    <p class="sub${over ? ' neg' : ''}">${hc ? `${hc} sleeping, ${cap} beds${over ? `. That’s ${hc - cap} over.` : ''}` : `${cap} beds open`}</p>${who}${mineHtml}`;
}
// Several nights at once: yourself, guests, or both.
function sheetBulk(){
  const B = S.bulk, n = B.nights.length, used = usedGuests(B.guests);
  return `<h2>${n} night${n === 1 ? '' : 's'}</h2><p class="sub">${B.nights.map(fmtDay).join(', ')}</p>

    ${used.length ? `<div class="pick" style="margin-top:10px">${used.map(g => `<button type="button" class="plain" data-act="bulk-guest-quick" data-name="${esc(g)}">+ ${esc(g)}</button>`).join('')}</div>` : ''}
    <p class="err" id="err"></p>
    <div class="actions"><button class="btn" data-act="sheet-close">Cancel</button><button class="btn primary" data-act="bulk-save">Add to ${n} night${n === 1 ? '' : 's'}</button></div>`;
}

// Every guest, grouped by the member who brought them, with what each still owes the collector.
function sheetGuests(){
  const { by, tot } = guestLedger(), col = collector(), can = canMarkGuests();
  const sponsors = Object.keys(by).sort((a, b) => member(a).name.localeCompare(member(b).name));
  if (!sponsors.length) return `<h2>Every guest</h2><p class="empty">No guests yet. When someone adds a guest to a night, they show up here.</p>
    <div class="actions"><button class="btn" data-act="sheet-close">Done</button></div>`;
  const dates = a => a.map(x => x.night).sort().map(fmtDay).join(', ');
  const body = sponsors.map(id => {
    const guests = Object.values(by[id]).sort((a, b) => a.name.localeCompare(b.name));
    return `<div class="grp">${chip(member(id))}<span>${esc(first(member(id)))}’s guests</span></div>
      <ul class="list">${guests.map(g => {
        const past = g.nights.filter(x => !x.future), future = g.nights.filter(x => x.future), n = g.nights.length;
        const data = `data-sponsor="${id}" data-name="${esc(g.name)}"`;
        const unpaid = g.nights.filter(x => !x.paid), due = g.owed + g.coming;      // everything not yet paid, upcoming nights included
        const note = `${g.name}, guest of ${first(member(id))}: ${dates(unpaid)}`;
        const url = due && col && col.venmo ? venmoUrl(col, 'pay', due, note) : '';
        let btns = '';
        if (url) btns += `<a class="btn small primary" href="${esc(url)}" target="_blank" rel="noopener">Pay ${esc(first(col))} on Venmo</a>
          <button class="btn small" data-act="guest-share" data-url="${esc(url)}" data-text="${esc(`${g.name}: ${money(due)} to ${col.name} for nights at the house (${dates(unpaid)}).`)}">Send pay link</button>`;
        if (can && due) btns += `<button class="btn small" data-act="guest-paid" data-v="1" ${data}>Mark ${money(due)} received</button>`;
        if (can && g.paid) btns += `<button class="btn small quiet" data-act="guest-paid" data-v="0" ${data}>Mark not received</button>`;
        btns += `<button class="btn small quiet" data-act="guest-cancel" ${data}>Cancel a night</button>`;
        return `<li><div class="rowi"><span class="grow"><span class="t">${esc(g.name)}</span>
          <span class="s">${n} night${n === 1 ? '' : 's'}${past.length ? ': ' + dates(past) : ''}</span>
          ${future.length ? `<span class="s">Upcoming: ${dates(future)}</span>` : ''}
          ${g.paid ? `<span class="s pos">Received ${money(g.paid)}${future.some(x => x.paid) ? ', including upcoming nights' : ''}</span>` : ''}</span>
          <span class="amt${g.owed ? ' neg' : ''}">${g.owed ? money(g.owed) + ' owed' : g.coming ? money(g.coming) + ' to come' : 'Received'}</span></div>
          ${btns ? `<div class="pay-btns">${btns}</div>` : ''}</li>`; }).join('')}</ul>`; }).join('');
  return `<h2>Every guest</h2><p class="sub">${col ? `Guests pay ${esc(col.name)} directly.` : 'The admin hasn’t set who guests pay yet.'}${can ? ' You can mark their fees as received.' : ''}</p>${body}
    <div class="grp"><span>Expected total</span><span class="amt">${money(tot.owed + tot.paid + tot.coming)}</span></div>
    <p class="note">${money(tot.owed)} owed so far, ${money(tot.paid)} received, ${money(tot.coming)} still to come.</p>
    <div class="actions"><button class="btn" data-act="sheet-close">Done</button></div>`;
}
// Admin only.
function sheetRoles(){
  return `<form data-form="roles"><h2>Full time and part time</h2>
    <p class="sub">Full-time members split the pot. A part-timer pays the lease you set here into it instead, can only book nights inside their dates, and is left out of new expenses unless picked. Leave the dates blank for no limit.</p>
    ${active().map(m => `<div class="rowi" style="flex-wrap:wrap;border-bottom:1px solid var(--line)">${chip(m)}<span class="grow"><span class="t">${esc(m.name)}</span></span>
      <select name="type-${m.id}" data-change="role" data-id="${m.id}" aria-label="${esc(m.name)}" style="width:auto;margin:0;min-height:40px"><option value="full"${m.part_time ? '' : ' selected'}>Full time</option><option value="part"${m.part_time ? ' selected' : ''}>Part time</option></select>

// The admin and the member who collects see this. Only the admin can pay the pot out.
function sheetPot(){
  const pt = pot(), col = collector(), full = fullTimers(), parts = partTimers(), admin = isAdmin();
  const line = (t, sub, c) => `<li><div class="rowi"><span class="grow"><span class="t">${t}</span>${sub ? `<span class="s">${sub}</span>` : ''}</span><span class="amt">${money(c)}</span></div></li>`;
  const leases = parts.length ? `<h2 style="margin:26px 0 8px">Part-time leases</h2><ul class="list">${parts.map(m => `<li><div class="rowi">${chip(m)}
      <span class="grow"><span class="t">${esc(m.name)}</span><span class="s${leasePaid(m) ? ' pos' : ''}">${leaseOf(m) ? (leasePaid(m) ? 'Received' : 'Not received yet') : 'No lease amount set'}</span></span>
      <span class="amt">${money(leaseOf(m))}</span></div>
      ${leaseOf(m) ? `<div class="pay-btns"><button class="btn small${leasePaid(m) ? ' quiet' : ''}" data-act="lease-paid" data-id="${m.id}" data-v="${leasePaid(m) ? 0 : 1}">${leasePaid(m) ? 'Mark not received' : 'Mark ' + money(leaseOf(m)) + ' received'}</button></div>` : ''}</li>`).join('')}</ul>` : '';
  return `<h2>The pot and leases</h2>
    <p class="sub">${col ? `Guest fees and part-time leases that ${esc(first(col))} has received, plus the security deposits due back.` : 'Nobody is set to collect guest and lease money yet.'} It’s held until it’s paid out, then split equally between full-time members.</p>

// Ask before doing something that's easy to do by accident. Resolves false, true, or the picked option.
function confirmBox(html){
  return new Promise(res => {
    const d = $('#confirm'); d.innerHTML = html; d.showModal(); d.focus();
    const done = v => { d.removeEventListener('click', onClick); d.removeEventListener('close', onClose); if (d.open) d.close(); res(v); };
    const onClick = e => { const b = e.target.closest('[data-confirm]');
      if (b) done(b.dataset.confirm === 'no' ? false : b.dataset.confirm === 'yes' ? (d.querySelector('select') ? d.querySelector('select').value : true) : b.dataset.confirm);
      else if (e.target === d) done(false); };
    const onClose = () => done(false);
    d.addEventListener('click', onClick); d.addEventListener('close', onClose);
  });
}
const cleanName = raw => String(raw || '').trim().replace(/\s+/g, ' ').slice(0, 40);
function setGuests(st, names){
  if (!names.length && st.host_away) return void del('stays', st.id);
  const row = { ...st, guests:names.length, guest_names:names };
  // Keep the rate the night was first booked at; a later rate change only affects new guest nights.
  if (names.length && !((st.guests || 0) > 0 && st.guest_fee_cents !== null && st.guest_fee_cents !== undefined)) row.guest_fee_cents = guestRate();
  save('stays', row);
}
function addGuest(st, raw){
  const name = cleanName(raw), names = guestNames(st).slice(), err = m => { const e = $('#err'); if (e) e.textContent = m; return false; };
  if (!name) return err('Type your guest’s name first.');
  if (names.some(n => n.toLowerCase() === name.toLowerCase())) return err(`${name} is already on this night.`);
  if (names.length >= 12) return err('That’s the most guests one person can add to a night.');

}

function addGuestTo(night, raw){

}

// One table per tab. Money is kept as real numbers so a spreadsheet can add it up.
function financeTables(){
  const num = c => Math.round(c) / 100, txt = c => (c / 100).toFixed(2), yes = v => v ? 'Yes' : 'No';
  const tabs = []; let cur; const tab = name => { cur = { name, rows: [] }; tabs.push(cur); }, add = (...r) => cur.rows.push(r), gap = () => cur.rows.push([]);
  const people = S.members.slice().sort((a, b) => a.name.localeCompare(b.name)), col = collector(), pt = pot(), full = fullTimers(), n = full.length || 1;
  const b = balances(), tIso = iso(today());
  const cut = pt.heads ? Math.ceil(pt.withheld / pt.heads) : 0, depBack = Math.max(0, pt.each - cut), share = Math.floor((pt.guests + pt.leases) / n);

  tab('Members');
  add('ski/lease finances'); add('House', S.house.name || ''); add('Exported', new Date().toLocaleString('en-US'));
  add('Lease', leaseText()); add('Guest fee per night', num(guestRate())); add('Guests and part-timers pay', col ? col.name : 'Not set');
  add('Pot paid out', yes(pt.paidOut)); gap();
  add('Member', 'Role', 'Balance now', 'Deposit due back', 'Share of guest fees and leases', 'Share of house bills', 'Due back from the pot', 'Lease', 'Lease received');
  for (const m of people){ if (m.active === false && !b[m.id]) continue;
    const isFull = full.some(f => f.id === m.id), bills = pt.costs.mine[m.id] || 0;
    add(m.name + (m.active === false ? ' (removed)' : ''), m.part_time ? 'Part time' : 'Full time', num(b[m.id] || 0),
      isFull ? num(depBack) : '', isFull ? num(share) : '', isFull ? num(-bills) : '', isFull ? num(depBack + share - bills) : '',
      m.part_time ? num(leaseOf(m)) : '', m.part_time ? yes(leasePaid(m)) : ''); }
  add('Total', '', num(people.reduce((x, m) => x + (b[m.id] || 0), 0))); gap();
  add(pt.paidOut ? 'The pot has been paid out, so "Due back from the pot" is already inside "Balance now".' : 'The pot has not been paid out, so "Due back from the pot" is not yet inside "Balance now".');

  tab('Balance ledger');
  add('Each row shows how it changed each person. Plus means owed money; minus means owes. Each column adds up to that person\'s balance.'); gap();
  add('Date', 'Type', 'Description', 'Paid by', 'Amount', 'Held until payout', ...people.map(m => m.name));
  const led = [];
  for (const e of S.expenses){ if (!member(e.paid_by)) continue;
    const sh = sharesOf(e), held = e.from_pot && !pt.paidOut, eff = {}; let wait = 0;
    for (const id in sh){ if (held && !isPart(id)){ wait += sh[id]; continue; } eff[id] = (eff[id] || 0) - sh[id]; eff[e.paid_by] = (eff[e.paid_by] || 0) + sh[id]; }
    led.push({ d:e.spent_on, c:e.created_at || '', r:[e.spent_on, e.from_pot ? 'House bill' : 'Expense', e.description, member(e.paid_by).name, num(e.amount_cents), wait ? num(wait) : ''], eff }); }
  for (const p of S.payments){ if (!member(p.from_member) || !member(p.to_member)) continue;
    led.push({ d:p.paid_on, c:p.created_at || '', r:[p.paid_on, 'Payment', `${member(p.from_member).name} paid ${member(p.to_member).name}${p.note ? ' (' + p.note + ')' : ''}`, member(p.from_member).name, num(p.amount_cents), ''],
      eff:{ [p.from_member]: p.amount_cents, [p.to_member]: -p.amount_cents } }); }
  if (pt.paidOut && col && pt.total){ const eff = { [col.id]: -pt.total }, ids = full.map(m => m.id).sort(), base = Math.floor(pt.total / ids.length); let rem = pt.total - base * ids.length;
    ids.forEach(id => { eff[id] = (eff[id] || 0) + base + (rem > 0 ? 1 : 0); if (rem > 0) rem--; });
    led.push({ d:'9999', c:'', r:['', 'Pot payout', 'Guest fees, leases, and deposits split between full-time members', col.name, num(pt.total), ''], eff }); }
  led.sort((x, y) => (x.d + x.c).localeCompare(y.d + y.c));
  const sums = {}; for (const l of led){ add(...l.r, ...people.map(m => l.eff[m.id] ? num(l.eff[m.id]) : '')); for (const id in l.eff) sums[id] = (sums[id] || 0) + l.eff[id]; }
  add('', '', 'Balance now', '', '', '', ...people.map(m => num(sums[m.id] || 0)));

  tab('The pot'); add('Item', 'Detail', 'Amount');
  add('Guest fees received', '', num(pt.guests)); add('Leases received', pt.leasesDue ? txt(pt.leasesDue) + ' still to collect' : '', num(pt.leases));
  add('Security deposits', `${pt.heads} x ${txt(pt.each)}, less ${txt(pt.withheld)} withheld`, num(pt.deposits));
  add('House bills', `${txt(pt.costs.all)} in bills, ${txt(pt.costs.part)} charged to part-timers`, num(-pt.costs.held)); add('In the pot', `${full.length} full-time members`, num(pt.net));

  add('Date', 'Description', 'Paid by', 'Amount', ...people.map(m => m.name));

  add('', 'Total', '', num(potExpenses().reduce((x, e) => x + e.amount_cents, 0)), ...people.map(m => bt[m.id] ? num(bt[m.id]) : ''));

  tab('Guest fees'); add('Night', 'Guest', 'Guest of', 'Member staying', 'Fee', 'Received', 'When');
  let gOwed = 0, gGot = 0, gCome = 0;
  for (const st of guestStays().slice().sort((x, y) => x.night.localeCompare(y.night))) for (const g of guestNames(st)){
    const fee = perGuest(st), got = isPaid(st, g), fut = st.night > tIso; if (got) gGot += fee; else if (fut) gCome += fee; else gOwed += fee;

  gap(); add('', 'Received', '', '', num(gGot)); add('', 'Owed so far', '', '', num(gOwed)); add('', 'Still to come', '', '', num(gCome)); add('', 'Expected total', '', '', num(gGot + gOwed + gCome));

  tab('Part-time leases'); add('Member', 'First night', 'Last night', 'Lease', 'Received');
  for (const m of partTimers()) add(m.name, m.active_from || '', m.active_until || '', num(leaseOf(m)), yes(leasePaid(m)));
  add('Total', '', '', num(partTimers().reduce((x, m) => x + leaseOf(m), 0)), txt(pt.leases) + ' received');
  return tabs;
}

function financeCsv(tabs){
  const cell = v => { let t = typeof v === 'number' ? v.toFixed(2) : v === null || v === undefined ? '' : String(v);
    if (typeof v !== 'number' && /^[=+\-@]/.test(t)) t = "'" + t;                // never let a name run as a formula
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  return tabs.map((t, i) => [`${i + 1}. ${t.name.toUpperCase()}`, ...t.rows.map(r => r.map(cell).join(','))].join('\r\n')).join('\r\n\r\n');
}
const XLSX_JS = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js';
let xlsxLoading = null;
const loadXlsx = () => xlsxLoading || (xlsxLoading = new Promise((ok, no) => { if (window.XLSX) return ok();
  const el = document.createElement('script'); el.src = XLSX_JS; el.onload = () => ok(); el.onerror = () => { xlsxLoading = null; no(new Error('library')); }; document.head.appendChild(el); }));
// A real spreadsheet file (.xlsx) with a tab per table. Google Sheets, Excel, and Numbers all open it.
function financeXlsx(tabs){
  const X = window.XLSX, wb = X.utils.book_new();
  for (const t of tabs){
    const ws = X.utils.aoa_to_sheet(t.rows), widths = [];
    t.rows.forEach((r, ri) => r.forEach((v, ci) => {
      const c = ws[X.utils.encode_cell({ r:ri, c:ci })]; if (c && typeof v === 'number') c.z = '#,##0.00';
      if (r.length > 1) widths[ci] = Math.min(46, Math.max(widths[ci] || 8, String(typeof v === 'number' ? v.toFixed(2) : v || '').length + 2)); }));
    ws['!cols'] = widths.map(w => ({ wch: w || 10 }));
    X.utils.book_append_sheet(wb, ws, t.name);
  }
  return X.write(wb, { bookType:'xlsx', type:'array' });
}

async function toggleNight(night){
  if (!S.me) return;
  const mine = myStay(night);
  if (!mine){
    if (!inLease(night)) return;
    if (!canBook(S.me, night)) return void toast(`That night is outside your part-time dates${myDates(S.me) ? ', ' + myDates(S.me) : ''}.`);
    return void save('stays', { id:uid(), member_id:S.me.id, night, guests:0, note:'' });
  }
  if (mine.host_away) return void save('stays', { ...mine, host_away:false });      // join my guests
  if (!(mine.guests > 0)) return void del('stays', mine.id);
  const names = guestNames(mine), pick = await confirmBox(`<h2>Take yourself off ${fmtDay(night)}?</h2>
    <p class="sub">You have ${names.length === 1 ? 'a guest' : 'guests'} on this night: ${names.map(esc).join(', ')}.</p>
    <div class="stack" style="margin-top:16px"><button class="btn primary" data-confirm="me">Just me, ${names.length === 1 ? 'my guest stays' : 'my guests stay'}</button>
      <button class="btn" data-confirm="all">Me and my guest${names.length === 1 ? '' : 's'}</button><button class="btn" data-confirm="no">Keep everything</button></div>`);
  if (pick === 'me') save('stays', { ...mine, host_away:true });
  else if (pick === 'all') del('stays', mine.id);
}

const forms = {
  expense(f){
    const amount_cents = toCents(f.amount.value), split = [...f.querySelectorAll('.pick [aria-pressed="true"]')].map(b => b.dataset.id);
    if (amount_cents <= 0) return void ($('#err').textContent = 'Enter an amount above zero.');
    if (!split.length) return void ($('#err').textContent = 'Pick at least one person to split it between.');
    const old = S.expenses.find(x => x.id === f.dataset.id);
    const row = { id: old ? old.id : uid(), description:f.description.value.trim(), amount_cents, paid_by:f.paid_by.value,
      split_among:split, spent_on:f.spent_on.value, created_at: old ? old.created_at : new Date().toISOString() };
    const fromPot = f.from_pot ? f.from_pot.checked : !!(old && old.from_pot);
    if (fromPot || (old && 'from_pot' in old)) row.from_pot = fromPot;
    closeSheet(); save('expenses', row); toast('Expense saved'); backToHistory();
  },
  payment(f){
    const amount_cents = toCents(f.amount.value);
    if (amount_cents <= 0) return void ($('#err').textContent = 'Enter an amount above zero.');
    if (!f.to_member.value) return void ($('#err').textContent = 'Choose who got paid.');
    if (f.from_member.value === f.to_member.value) return void ($('#err').textContent = 'Pick two different people.');
    const old = S.payments.find(x => x.id === f.dataset.id);
    const row = { id: old ? old.id : uid(), from_member:f.from_member.value, to_member:f.to_member.value, amount_cents,
      paid_on:f.paid_on.value, note:f.note.value.trim(), created_at: old ? old.created_at : new Date().toISOString() };
    const back = S.backToSettle; S.backToSettle = false;
    closeSheet(); save('payments', row); toast('Payment saved');
    if (back && settle(balances()).some(x => x.from === S.me.id || x.to === S.me.id)) openSheet(sheetSettle(), { type:'settle' });
    else backToHistory();
  },
  member(f){
    const email = f.email.value.trim().toLowerCase(), old = member(f.dataset.id);
    if (old && !(S.me && old.id === S.me.id)) return;                       // a profile belongs to its owner
    const clash = S.members.find(m => m.email.toLowerCase() === email && (!old || m.id !== old.id));
    if (clash && clash.active !== false) return void ($('#err').textContent = `${clash.name} already uses that email.`);
    if (clash && !isAdmin()) return void ($('#err').textContent = 'That email belongs to someone who was removed. Ask the house admin to add them back.');
    const venmo = f.venmo.value.trim().replace(/^https?:\/\/(www\.)?venmo\.com\/(u\/)?/i, '').replace(/^@/, '').replace(/[?\/].*$/, '');
    if (!/^[A-Za-z0-9_-]{0,40}$/.test(venmo)) return void ($('#err').textContent = 'Venmo usernames use only letters, numbers, dashes, and underscores.');
    const base = old || clash || { id:uid(), color:PALETTE[S.members.length % PALETTE.length] };
    const row = { ...base, name:f.name.value.trim(), email, phone:fmtPhone(f.phone.value), active:true };
    if (venmo || base.venmo) row.venmo = venmo || null;
    if (f.avatar && f.avatar.value !== (base.avatar || '')) row.avatar = f.avatar.value || null;
    if (f.color && HEX_RE.test(f.color.value)) row.color = f.color.value;
    const mine = S.me && row.id === S.me.id; if (mine) S.me = row;
    closeSheet(); save('members', row); toast(mine ? 'Your details are saved' : 'Member saved');
  },
  'guest-add'(f){ if (addGuestTo(f.dataset.night, f.guest.value)){ const i = $('#sheet [name=guest]'); if (i) i.focus(); } },
  'bulk-guest'(f){
    const name = cleanName(f.guest.value), B = S.bulk; if (!B) return;
    if (!name) return void ($('#err').textContent = 'Type your guest’s name first.');
    if (B.guests.some(g => g.toLowerCase() === name.toLowerCase())) return void ($('#err').textContent = `${name} is already on the list.`);
    B.guests.push(name); render(); const i = $('#sheet [name=guest]'); if (i) i.focus();

  roles(f){
    if (!isAdmin()) return;
    const changes = [];
    for (const m of active()){
      const part = f['type-' + m.id].value === 'part', lease = part ? toCents(f['lease-' + m.id].value) : 0;
      const from = part ? (f['from-' + m.id].value || null) : null, until = part ? (f['until-' + m.id].value || null) : null;
      if (from && until && until < from) return void ($('#err').textContent = `${first(m)}’s last night is before their first night.`);
      if (part !== !!m.part_time || lease !== leaseOf(m) || from !== (m.active_from || null) || until !== (m.active_until || null)){
        const row = { ...m, part_time:part, lease_cents:lease };
        if ('active_from' in m || from) row.active_from = from;
        if ('active_until' in m || until) row.active_until = until;
        changes.push(row);
      }
    }
    if (active().every(m => f['type-' + m.id].value === 'part')) return void ($('#err').textContent = 'At least one member has to be full time.');

  manage(f){
    const m = member(f.dataset.id), email = f.email.value.trim().toLowerCase(); if (!m || !isAdmin()) return;
    const clash = S.members.find(x => x.email.toLowerCase() === email && x.id !== m.id);
    if (clash) return void ($('#err').textContent = `${clash.name} already uses that email.`);
    closeSheet(); save('members', { ...m, email }); toast('Email saved');
  },
  house(f){
    if (!isAdmin()) return;
    const row = { ...S.house, id:1, name:f.name.value.trim(), address:f.address.value.trim(), door_code:f.door_code.value.trim(),
      wifi_name:f.wifi_name.value.trim(), wifi_password:f.wifi_password.value.trim(), beds:parseInt(f.beds.value, 10) || 0, notes:f.notes.value.trim() };
    const link = f.listing_url.value.trim();
    if (link && !/^https?:\/\//i.test(link)) return void toast('The listing link has to start with https://');
    if ('listing_url' in S.house || link) row.listing_url = link || null;
    if (f.lease_start && isAdmin()){
      const a = f.lease_start.value || null, b = f.lease_end.value || null;
      if (a && b && b <= a) return void toast('The lease has to end after it starts.');
      if ('lease_start' in S.house || a) row.lease_start = a;
      if ('lease_end' in S.house || b) row.lease_end = b;
    }
    if (f.guest_fee && isAdmin()){ const fee = toCents(f.guest_fee.value); if ('guest_fee_cents' in S.house || fee !== 6000) row.guest_fee_cents = fee; }
    closeSheet(); save('house', row); S.month = defaultMonth(); toast('House info saved');
  }
};

document.addEventListener('click', e => { if (e.target.closest('#confirm')) return; const el = e.target.closest('[data-act]'); if (el && actions[el.dataset.act]) actions[el.dataset.act](el); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); forms[f.dataset.form](f); });
document.addEventListener('input', e => { if (e.target.name === 'amount') updateEach(); });
document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k === 'note'){ const s = myStay(e.target.dataset.night); if (s) save('stays', { ...s, note:e.target.value.trim() }); }
  if (k === 'avafile' && e.target.files[0]){
    fileToAvatar(e.target.files[0]).then(setAvatar).catch(() => { $('#err').textContent = 'That picture couldn’t be read. Try a different one.'; });
    e.target.value = '';
  }
  if (k === 'phone') e.target.value = fmtPhone(e.target.value);
  if (k === 'potflag' || (k === 'expdate' && e.target.form.from_pot && e.target.form.from_pot.checked)){
    const f = e.target.form, ids = new Set((f.from_pot.checked ? onLeaseInMonth(f.spent_on.value) : fullTimers()).map(m => m.id));
    f.querySelectorAll('.pick button').forEach(b => b.setAttribute('aria-pressed', ids.has(b.dataset.id))); updateEach();
  }
  if (k === 'bulkstay' && S.bulk) S.bulk.staying = e.target.checked;
  if (k === 'role'){ const l = document.getElementById('lease-' + e.target.dataset.id); if (l) l.hidden = e.target.value !== 'part'; }
  if (k === 'viewas'){ S.me = member(e.target.value); persist(); render(); toast(`Now seeing the app as ${first(S.me)}`); }
});
$('#sheet').addEventListener('close', () => { S.sheet = null; S.bulk = null; });
$('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });

/* ---------- routing and start ---------- */
function go(v){ S.view = VIEWS.includes(v) ? v : 'nights'; if (location.hash.slice(1) !== S.view) history.replaceState(null, '', '#' + S.view); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view){ S.view = v; render(); } });

async function start(){
  const t = today(); S.month = S.month || new Date(t.getFullYear(), t.getMonth(), 1);
  const firstLoad = !S.loaded;
  const v = location.hash.slice(1); if (VIEWS.includes(v)) S.view = v;
  const back = new URLSearchParams((location.hash || '').slice(1) || location.search);
  if (back.get('error_description')){ S.authErr = 'Sign-in didn’t finish: ' + back.get('error_description').replace(/\+/g, ' '); history.replaceState(null, '', location.pathname); }
  S.gate = 'loading'; render();
  try {
    if (LIVE){
      if (!sb){
        await Live.init();
        sb.auth.onAuthStateChange((ev, session) => { const em = session && session.user && session.user.email || null;
          if (em !== sessionEmail && (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT')){ sessionEmail = em; setTimeout(start, 0); } });
      }
      const { data } = await sb.auth.getSession();
      sessionEmail = data.session && data.session.user.email || null;
      if (!sessionEmail){ S.gate = 'signin'; return render(); }
    }
    await reload(); if (!LIVE) persist();
    if (firstLoad){ S.month = defaultMonth(); S.loaded = true; }
  } catch(e){ console.error(e); S.gate = 'error'; S.errText = [e && e.code, e && e.message].filter(Boolean).join(': '); }
  render();
}
// Other people's changes show up when you come back to the tab.
document.addEventListener('visibilitychange', () => { if (LIVE && !document.hidden && S.me && !$('#sheet').open) reload().then(render).catch(() => {}); });
start();
})();
</script>
